function exGlyph(e) { return { image: '🖼', pdf: '📄', text: '📝', email: '✉', audio: '🎧', video: '🎞', other: '▤' }[e.kind] || '▤'; }

// Downscale image evidence to embeddable JPEG data URLs so the exported file is
// self-contained and portable (object URLs would not survive outside the app).
async function buildThumbs(level) {
  const map = new Map();
  if (level < 2) return map;
  const imgs = S.evidence.filter(e => e.hasFile && e.blob && e.kind === 'image').slice(0, 120);
  for (const e of imgs) {
    try {
      if (e.blob.size > 16 * 1024 * 1024) continue;
      const url = URL.createObjectURL(e.blob);
      const dataUrl = await new Promise(res => {
        const img = new Image();
        img.onload = () => {
          const max = 560, scale = Math.min(1, max / Math.max(img.width, img.height));
          const w = Math.max(1, Math.round(img.width * scale)), h = Math.max(1, Math.round(img.height * scale));
          const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
          try { cv.getContext('2d').drawImage(img, 0, 0, w, h); res(cv.toDataURL('image/jpeg', 0.82)); } catch (_) { res(null); }
        };
        img.onerror = () => res(null);
        img.src = url;
      });
      URL.revokeObjectURL(url);
      if (dataUrl) map.set(e.id, dataUrl);
    } catch (_) {}
  }
  return map;
}

function evMini(e, thumbs, lvl, c) {
  const t = thumbs && thumbs.get(e.id);
  const vis = t ? `<img class="ex-thumb" src="${t}" alt="">` : `<span class="ex-ic">${exGlyph(e)}</span>`;
  const loc = c && c.locVal ? ` · ${esc(c.locVal)}` : '';
  const primary = e.description ? escML(e.description) : esc(e.name);
  const sub = e.description ? `<div class="ex-fn">${esc(e.name)}${loc}</div>` : (loc ? `<div class="ex-fn">${loc.replace(/^ · /, '')}</div>` : '');
  const snip = (lvl >= 4 && c && c.snippet) ? `<div class="ex-snip">“${esc(c.snippet)}”</div>` : '';
  return `<div class="ex"><div class="ex-top">${vis}<span class="ex-name">${primary}</span></div>${sub}${snip}</div>`;
}
// Compact one-line evidence item (tiny thumbnail + description, filename as subtext) —
// used in lists where a full exhibit card would be too heavy. A filename alone isn't useful.
function evCompactItem(e, thumbs) {
  const t = thumbs && thumbs.get(e.id);
  const vis = t ? `<img class="ex-thumb sm" src="${t}" alt="">` : `<span class="ex-ic sm">${exGlyph(e)}</span>`;
  const primary = e.description ? escML(e.description) : esc(e.name);
  const sub = e.description ? `<span class="ev-fn">${esc(e.name)}</span>` : '';
  return `<li class="ev-li">${vis}<span class="ev-tx">${primary}${sub}</span></li>`;
}
function evBlockForFact(f, thumbs, lvl) {
  if (lvl < 2) return '';
  const cs = citesFor(f.id);
  if (!cs.length) return '<div class="ev-none">No evidence linked yet.</div>';
  const items = cs.map(c => { const e = byId(S.evidence, c.evidenceId); return e ? evMini(e, thumbs, lvl, c) : ''; }).filter(Boolean).join('');
  return `<div class="ev-row">${items}</div>`;
}

function exSecCover() {
  const m = S.matter || {};
  const rows = [['Matter', m.title || 'Untitled matter'], ['Court / type', m.subtitle], ['Case number', m.number],
    ['Jurisdiction', m.jurisdiction], ['Venue', m.venue], ['Relief sought', m.reliefSought]].filter(r => r[1]);
  const html = `<table class="caption">${rows.map(r => `<tr><th>${esc(r[0])}</th><td>${esc(r[1])}</td></tr>`).join('')}</table>`
    + `<div class="prepared">Prepared ${esc(new Date().toLocaleDateString(undefined, { year: 'numeric', month: 'long', day: 'numeric' }))} · Caseframe</div>`;
  return { id: 'cover', title: m.title || 'Case dossier', blocks: [{ html }] };
}
function exSecIntro(lvl) {
  const m = S.matter || {}; const s = (m.summary || '').trim();
  if (!s) return { id: 'intro', title: 'Introduction', blocks: [{ html: EXP_NOTE('No background written yet. Add it in “Edit matter & theory” so the dossier opens with a clear summary.') }] };
  let text = s;
  if (lvl === 1) { const parts = s.split(/(?<=[.!?])\s+/); text = parts.slice(0, 2).join(' '); }
  return { id: 'intro', title: 'Introduction', blocks: [{ html: `<p>${escML(text)}</p>` }] };
}
function exSecParties(lvl, expanded, thumbs) {
  const ppl = S.people.slice().sort((a, b) => a.name.localeCompare(b.name));
  if (!ppl.length) return { id: 'parties', title: 'Parties', blocks: [{ html: EXP_NOTE('No people added yet.') }] };
  if (!expanded) {
    const html = '<ul class="party-list">' + ppl.map(p => `<li><b>${esc(p.name)}</b> — <span class="role">${esc(p.role || '—')}</span></li>`).join('') + '</ul>';
    return { id: 'parties', title: 'Parties', blocks: [{ html }] };
  }
  const blocks = ppl.map(p => {
    const facts = linkedIds('person', p.id, 'fact').map(id => byId(S.facts, id)).filter(Boolean).sort((a, b) => a.date.localeCompare(b.date));
    const evs = lvl >= 2 ? linkedIds('person', p.id, 'evidence').map(id => byId(S.evidence, id)).filter(Boolean) : [];
    const factH = facts.length ? '<div class="sub-h">Connected facts</div><ul>' + facts.map(f => `<li>${esc(fmtDate(f.date, f.precision))} — ${esc(f.title)}</li>`).join('') + '</ul>' : EXP_NOTE('No facts linked yet.');
    const evH = evs.length ? '<div class="sub-h">Connected evidence</div><ul class="ev-list">' + evs.map(e => evCompactItem(e, thumbs)).join('') + '</ul>' : '';
    return { title: p.name, html: `<div class="person-head"><b>${esc(p.name)}</b> <span class="role">${esc(p.role || '')}</span></div>${factH}${evH}` };
  });
  return { id: 'parties', title: 'Parties', blocks };
}
function exSecTheory(lvl) {
  const m = S.matter || {}; const t = (m.theory || '').trim(); const blocks = [];
  blocks.push({ html: t ? `<p>${escML(t)}</p>` : EXP_NOTE('No theory of the case written yet.') });
  if (lvl >= 2 && S.theories.length) S.theories.forEach(th => {
    let h = `<div class="sub-h">${esc(th.name || 'Theory')}</div>`;
    if (th.summary) h += `<p>${escML(th.summary)}</p>`;
    if (lvl >= 3 && th.narrative) h += `<p>${escML(th.narrative)}</p>`;
    blocks.push({ title: th.name || 'Theory', html: h });
  });
  return { id: 'theory', title: 'Theory of the case', blocks };
}
function exSecClaims(lvl, expanded, thumbs) {
  const issues = S.issues.slice().sort((a, b) => a.name.localeCompare(b.name));
  if (!issues.length) return { id: 'claims', title: 'Claims & elements', blocks: [{ html: EXP_NOTE('No issues/elements added yet.') }] };
  if (!expanded && lvl < 2) {
    const html = '<ul>' + issues.map(i => { const n = S.facts.filter(f => f.issueIds.includes(i.id)).length; return `<li><b>${esc(i.name)}</b> — ${n} fact${n === 1 ? '' : 's'}</li>`; }).join('') + '</ul>';
    return { id: 'claims', title: 'Claims & elements', blocks: [{ html }] };
  }
  const blocks = issues.map(i => {
    const facts = S.facts.filter(f => f.issueIds.includes(i.id)).sort((a, b) => a.date.localeCompare(b.date));
    const auth = linkedIds('issue', i.id, 'authority').map(id => byId(S.authorities, id)).filter(Boolean);
    let h = '';
    if (i.description) h += `<p>${escML(i.description)}</p>`;
    if (auth.length) h += '<div class="sub-h">Governing law</div><ul>' + auth.map(a => `<li>${esc(a.name)}${a.citation ? ' — <span class="cite">' + esc(a.citation) + '</span>' : ''}</li>`).join('') + '</ul>';
    if (facts.length) {
      h += '<div class="sub-h">Supporting facts &amp; proof</div>';
      h += facts.map(f => `<div class="proof"><div class="pf-fact"><span class="st ${esc(f.status || '')}">${esc(f.status || '')}</span> ${esc(fmtDate(f.date, f.precision))} — ${esc(f.title)}</div>${expanded ? evBlockForFact(f, thumbs, lvl) : ''}</div>`).join('');
    } else h += EXP_NOTE('No facts linked to this element yet — a gap to fill before trial.');
    return { title: i.name, html: `<div class="claim-head">${esc(i.name)}</div>${h}` };
  });
  return { id: 'claims', title: 'Claims & elements', blocks };
}
function exSecChronology(lvl, expanded, thumbs) {
  const facts = S.facts.slice().sort((a, b) => a.date.localeCompare(b.date));
  if (!facts.length) return { id: 'chronology', title: 'Statement of facts (chronology)', blocks: [{ html: EXP_NOTE('No facts added yet.') }] };
  if (!expanded) {
    const html = '<ul class="chrono">' + facts.map(f => `<li><span class="d">${esc(fmtDate(f.date, f.precision))}</span> ${esc(f.title)}</li>`).join('') + '</ul>';
    return { id: 'chronology', title: 'Statement of facts (chronology)', blocks: [{ html }] };
  }
  const blocks = facts.map(f => {
    const ppl = f.personIds.map(personName).filter(x => x && x !== '—');
    const iss = f.issueIds.map(issueName).filter(x => x && x !== '—');
    const tags = (f.tagIds || []).map(tagName).filter(x => x && x !== '—');
    const meta = [ppl.length ? 'People: ' + ppl.join(', ') : '', iss.length ? 'Elements: ' + iss.join(', ') : '', (lvl >= 4 && tags.length) ? 'Tags: ' + tags.map(t => '#' + t).join(' ') : ''].filter(Boolean);
    return { title: fmtDate(f.date, f.precision), html: `<div class="fact-head"><span class="st ${esc(f.status || '')}">${esc(f.status || '')}</span> <span class="fd">${esc(fmtDate(f.date, f.precision))}</span> — ${esc(f.title)}</div>${meta.length ? '<div class="fmeta">' + esc(meta.join(' · ')) + '</div>' : ''}${evBlockForFact(f, thumbs, lvl)}` };
  });
  return { id: 'chronology', title: 'Statement of facts (chronology)', blocks };
}
function exSecEvidence(lvl, expanded, thumbs) {
  const evs = S.evidence.slice();
  if (!evs.length) return { id: 'evidence', title: 'Evidence inventory', blocks: [{ html: EXP_NOTE('No evidence added yet.') }] };
  const colls = new Map(), singles = [];
  evs.forEach(e => { const c = (e.collection || '').trim(); if (c) { if (!colls.has(c)) colls.set(c, []); colls.get(c).push(e); } else singles.push(e); });
  if (!expanded) {
    let h = '';
    colls.forEach((items, name) => { h += `<div class="sub-h">${esc(name)} <span class="muted">(${items.length})</span></div><ul class="ev-list">` + items.map(e => evCompactItem(e, thumbs)).join('') + '</ul>'; });
    if (singles.length) h += '<ul class="ev-list">' + singles.map(e => evCompactItem(e, thumbs)).join('') + '</ul>';
    return { id: 'evidence', title: 'Evidence inventory', blocks: [{ html: h }] };
  }
  const one = e => {
    const t = thumbs && thumbs.get(e.id);
    const vis = t ? `<img class="ex-thumb lg" src="${t}" alt="">` : `<span class="ex-ic lg">${exGlyph(e)}</span>`;
    const proves = citesOf(e.id).map(c => byId(S.facts, c.factId)).filter(Boolean);
    const meta = [e.hasFile ? e.kind + ' · ' + (e.size / 1048576).toFixed(2) + ' MB' : 'reference', (lvl >= 4 && e.hash) ? 'SHA-256 ' + e.hash.slice(0, 16) + '…' : ''].filter(Boolean).join(' · ');
    const desc = e.description ? `<p>${escML(e.description)}</p>` : '';
    const pv = proves.length ? '<div class="sub-h">Proves</div><ul>' + proves.map(f => `<li>${esc(fmtDate(f.date, f.precision))} — ${esc(f.title)}</li>`).join('') + '</ul>' : '';
    return `<div class="ex-full">${vis}<div class="ex-info"><b>${esc(e.name)}</b><div class="muted">${esc(meta)}</div>${desc}${pv}</div></div>`;
  };
  const blocks = [];
  colls.forEach((items, name) => blocks.push({ title: name, html: `<div class="coll-head">Collection: ${esc(name)} <span class="muted">(${items.length})</span></div>` + items.map(one).join('') }));
  singles.forEach(e => blocks.push({ title: e.name, html: one(e) }));
  return { id: 'evidence', title: 'Evidence inventory', blocks };
}
function exSecDamages(lvl) {
  const m = S.matter || {}; let h = '';
  if (m.damagesAmount) h += `<div class="dmg-amt">${esc(m.damagesAmount)}</div>`;
  if (m.damagesNote) h += `<p>${escML(m.damagesNote)}</p>`;
  const dTag = S.tags.find(t => /damage/i.test(t.name));
  const dIssues = S.issues.filter(i => /damage|harm|injur|loss/i.test(i.name));
  const dFacts = S.facts.filter(f => (dTag && (f.tagIds || []).includes(dTag.id)) || f.issueIds.some(id => dIssues.find(x => x.id === id)));
  if (dFacts.length) h += '<div class="sub-h">Supporting facts</div><ul>' + dFacts.slice().sort((a, b) => a.date.localeCompare(b.date)).map(f => `<li>${esc(fmtDate(f.date, f.precision))} — ${esc(f.title)}</li>`).join('') + '</ul>';
  if (!h) h = EXP_NOTE('No damages recorded yet. Add an estimate and notes in “Edit matter & theory,” and tag the facts/evidence that prove each category.');
  return { id: 'damages', title: 'Damages', blocks: [{ html: h }] };
}
function exSecAuthorities(lvl) {
  const all = S.authorities.slice();
  // Only authorities actually tied into the case — linked to an issue, fact, person,
  // evidence, or theory. The Research library at large is NOT dumped here.
  const linked = all.filter(x => ['fact', 'issue', 'theory', 'person', 'evidence'].some(tp => linkedIds('authority', x.id, tp).length));
  if (!linked.length) return { id: 'authorities', title: 'Legal authorities', blocks: [{ html: EXP_NOTE('No authorities linked to the case yet. In Research, link a statute, case, or principle to an issue, fact, person, or piece of evidence and it will appear here.') }] };
  const list = linked.sort((x, y) => (x.name || '').localeCompare(y.name || ''));
  const html = '<ul class="auth-list">' + list.map(x => {
    let s = `<li><b>${esc(x.name)}</b>`;
    if (x.citation) s += ` — <span class="cite">${esc(x.citation)}</span>`;
    if (x.jurisdiction) s += ` <span class="muted">(${esc(jurisLabel(x.jurisdiction))})</span>`;
    if (lvl >= 3 && x.body) s += `<div class="auth-body">${escML(short(x.body, 340))}</div>`;
    if (lvl >= 3 && x.context) s += `<div class="auth-ctx">${escML(x.context)}</div>`;
    return s + '</li>';
  }).join('') + '</ul>';
  return { id: 'authorities', title: 'Legal authorities', blocks: [{ html }] };
}
function exSecOpenQ() {
  const disputed = S.facts.filter(f => f.status === 'Disputed');
  const noEvIssues = S.issues.filter(i => { const fs = S.facts.filter(f => f.issueIds.includes(i.id)); return fs.length && fs.every(f => citesFor(f.id).length === 0); });
  const emptyIssues = S.issues.filter(i => !S.facts.some(f => f.issueIds.includes(i.id)));
  const noEvTheories = S.theories.filter(t => !(t.evidenceIds || []).length && !(t.factIds || []).some(fi => citesFor(fi).length));
  const items = [];
  if (emptyIssues.length) items.push(`${emptyIssues.length} element(s) with no facts yet: ${emptyIssues.map(i => esc(i.name)).join(', ')}.`);
  if (noEvIssues.length) items.push(`${noEvIssues.length} element(s) whose facts have no evidence: ${noEvIssues.map(i => esc(i.name)).join(', ')}.`);
  if (disputed.length) items.push(`${disputed.length} disputed fact(s) needing corroboration.`);
  if (noEvTheories.length) items.push(`${noEvTheories.length} theory/theories with no evidence attached.`);
  if (!items.length) items.push('No obvious gaps detected — every element has facts and evidence, and no facts are flagged disputed.');
  return { id: 'openq', title: 'Open questions & gaps', blocks: [{ html: '<ul>' + items.map(t => `<li>${t}</li>`).join('') + '</ul>' }] };
}
const EXPORT_RENDER = { cover: exSecCover, intro: exSecIntro, parties: exSecParties, theory: exSecTheory, claims: exSecClaims, chronology: exSecChronology, evidence: exSecEvidence, damages: exSecDamages, authorities: exSecAuthorities, openq: exSecOpenQ };
const EXPORT_LEAD = { chronological: 'chronology', claim: 'claims', party: 'parties', evidence: 'evidence' };
function exportOrder(perspective) {
  const body = ['claims', 'chronology', 'evidence', 'parties'];
  const lead = EXPORT_LEAD[perspective] || 'chronology';
  return ['cover', 'intro', 'theory', lead, ...body.filter(x => x !== lead), 'damages', 'authorities', 'openq'];
}
function exportCollect(opts) {
  const lvl = DEPTH_LEVEL[opts.depth] || 2;
  const lead = EXPORT_LEAD[opts.perspective] || 'chronology';
  const out = [];
  for (const id of exportOrder(opts.perspective)) {
    if (!opts.sections.includes(id)) continue;
    const fn = EXPORT_RENDER[id]; if (!fn) continue;
    const built = fn(lvl, id === lead, opts._thumbs);
    if (built && built.blocks && built.blocks.length) out.push(built);
  }
  return out;
}

function renderDossier(sections, opts) {
  const m = S.matter || {};
  const deck = opts.mode === 'deck';
  const title = esc(m.title || 'Case dossier');
  const persp = (EXPORT_PERSPECTIVES.find(p => p[0] === opts.perspective) || [])[1] || '';
  const depth = (EXPORT_DEPTHS.find(d => d[0] === opts.depth) || [])[1] || '';
  const coverSec = sections.find(s => s.id === 'cover');
  const rest = sections.filter(s => s.id !== 'cover');
  let body;
  if (deck) {
    let slides = '';
    if (coverSec) slides += `<section class="slide cover-slide"><div class="sl-in"><div class="cv-eyebrow">Case dossier</div><h1>${title}</h1>${coverSec.blocks[0].html}<div class="cv-mode">${esc(persp)} · ${esc(depth)}</div></div></section>`;
    rest.forEach(sec => sec.blocks.forEach(b => {
      const head = b.title ? `<div class="s-kicker">${esc(sec.title)}</div><h2>${esc(b.title)}</h2>` : `<h2>${esc(sec.title)}</h2>`;
      slides += `<section class="slide"><div class="sl-in">${head}<div class="s-body">${b.html}</div></div></section>`;
    }));
    body = slides;
  } else {
    let doc = '';
    if (coverSec) doc += `<header class="cover"><div class="cv-eyebrow">Case dossier</div><h1>${title}</h1>${coverSec.blocks[0].html}<div class="cv-mode">${esc(persp)} · ${esc(depth)} view</div></header>`;
    rest.forEach(sec => {
      doc += `<section class="sec"><h2>${esc(sec.title)}</h2>`;
      sec.blocks.forEach(b => { doc += `<div class="blk">${b.title ? `<h3>${esc(b.title)}</h3>` : ''}${b.html}</div>`; });
      doc += '</section>';
    });
    body = `<main class="doc">${doc}</main>`;
  }
  const toolbar = opts.preview ? '' : `<div class="toolbar no-print"><span class="tb-title">${title}</span><span class="tb-sub">${esc(persp)} · ${esc(depth)}</span><button onclick="window.print()">Print / Save as PDF</button></div>`;
  const credit = opts.preview ? '' : `<footer class="credit no-print">Generated by Caseframe · ${esc(new Date().toLocaleString())}</footer>`;
  const css = EXPORT_DOC_CSS + (deck ? EXPORT_DECK_CSS : EXPORT_BRIEF_CSS);
  return `<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>${title} — Caseframe dossier</title><style>${css}</style></head><body class="${deck ? 'deck' : 'brief'}">${toolbar}${body}${credit}</body></html>`;
}

async function deliverExport(html, name) {
  const fname = (name || 'caseframe-dossier') + '.html';
  if (typeof window.__CF_SAVE_HTML === 'function') {
    try {
      const path = await window.__CF_SAVE_HTML(html, fname);
      if (path) { if (typeof window.__CF_OPEN === 'function') await window.__CF_OPEN(path); toast('Dossier saved — opening to print'); }
      else toast('Export cancelled');
      return;
    } catch (e) { console.error(e); }
  }
  const w = window.open('', '_blank');
  if (!w) { toast('Allow pop-ups to open the dossier'); return; }
  w.document.open(); w.document.write(html); w.document.close();
}

// Downscale an image file to a small embeddable JPEG data URL (member photos).
function cfImgDataURL(file, max) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file); const img = new Image();
    img.onload = () => { const s = Math.min(1, max / Math.max(img.width, img.height)); const w = Math.max(1, Math.round(img.width * s)), h = Math.max(1, Math.round(img.height * s)); const cv = document.createElement('canvas'); cv.width = w; cv.height = h; cv.getContext('2d').drawImage(img, 0, 0, w, h); URL.revokeObjectURL(url); try { res(cv.toDataURL('image/jpeg', 0.85)); } catch (e) { rej(e); } };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('image')); };
    img.src = url;
  });
}

async function importMemberFromBackup(obj, memberName) {
  const idmap = {}; const nid = o => { if (!o) return o; if (!idmap[o]) idmap[o] = uid(); return idmap[o]; };
  const mid = uid();
  const member = { id: mid, name: memberName || 'Imported member', status: 'Prospective', groupId: '', ref: '', email: '', phone: '', notes: 'Imported from a Caseframe backup on ' + new Date().toLocaleDateString(), createdAt: Date.now() };
  for (const i of (obj.issues || [])) { const ex = S.issues.find(x => (x.name || '').toLowerCase() === (i.name || '').toLowerCase()); if (ex) idmap[i.id] = ex.id; else { const rec = Object.assign({}, i, { id: nid(i.id) }); S.issues.push(rec); await Store.issues.put(rec); } }
  for (const t of (obj.tags || [])) { const ex = S.tags.find(x => (x.name || '').toLowerCase() === (t.name || '').toLowerCase()); if (ex) idmap[t.id] = ex.id; else { const rec = Object.assign({}, t, { id: nid(t.id) }); S.tags.push(rec); await Store.tags.put(rec); } }
  for (const a of (obj.authorities || [])) { const key = (a.name || '') + '|' + (a.citation || ''); const ex = S.authorities.find(x => ((x.name || '') + '|' + (x.citation || '')) === key); if (ex) idmap[a.id] = ex.id; else { const rec = Object.assign({}, a, { id: nid(a.id) }); S.authorities.push(rec); await Store.authorities.put(rec); } }
  for (const p of (obj.people || [])) { const rec = Object.assign({}, p, { id: nid(p.id), tagIds: (p.tagIds || []).map(nid) }); S.people.push(rec); await Store.people.put(rec); }
  for (const th of (obj.theories || [])) { const ex = S.theories.find(x => x.name && th.name && x.name.toLowerCase() === th.name.toLowerCase()); if (ex) { idmap[th.id] = ex.id; } else { const rec = Object.assign({}, th, { id: nid(th.id), issueIds: (th.issueIds || []).map(nid), factIds: (th.factIds || []).map(nid), evidenceIds: (th.evidenceIds || []).map(nid), personIds: (th.personIds || []).map(nid), tagIds: (th.tagIds || []).map(nid) }); S.theories.push(rec); await Store.theories.put(rec); } }
  for (const e of (obj.evidence || [])) { const rec = Object.assign({}, e, { id: nid(e.id), memberId: mid }); const data = rec.data; delete rec.data; delete rec.skipped; if (data) { try { rec.blob = dataURLtoBlob(data); rec.hasFile = true; } catch (_) { rec.hasFile = false; } } S.evidence.push(rec); await Store.evidence.put(rec); }
  for (const f of (obj.facts || [])) { const rec = Object.assign({}, f, { id: nid(f.id), memberId: mid, personIds: (f.personIds || []).map(nid), issueIds: (f.issueIds || []).map(nid), tagIds: (f.tagIds || []).map(nid), relatedIds: (f.relatedIds || []).map(nid) }); S.facts.push(rec); await Store.facts.put(rec); }
  for (const c of (obj.citations || [])) { const rec = Object.assign({}, c, { id: nid(c.id), factId: nid(c.factId), evidenceId: nid(c.evidenceId) }); S.citations.push(rec); await Store.citations.put(rec); }
  if (obj.matter && obj.matter.theory && S.matter && !((S.matter.theory || '').trim())) { S.matter.theory = obj.matter.theory; await Store.meta.put(S.matter); }
  S.members.push(member); await Store.members.put(member);
  return member.name;
}
async function doImportMembers(files) {
  let n = 0; const names = [];
  for (const file of files) {
    try {
      const text = await cfUnprotect(await file.text());
      if (text === null) continue;
      const obj = JSON.parse(text);
      if (obj.format !== 'caseframe-local-v2') { toast('Skipped ' + file.name + ' — not a Caseframe backup'); continue; }
      const nm = await importMemberFromBackup(obj, deriveMemberName(obj, file.name));
      n++; names.push(nm);
    } catch (e) { if (e && /cancel/i.test(e.message || '')) continue; console.error(e); toast('Could not import ' + file.name); }
  }
  if (n) { render(); toast(n + ' member(s) imported'); cfClassIntro(names); }
}
function cfClassIntro(names) {
  try {
    cfToggleAssistant(true);
    cfAddMsg('bot', `Imported <b>${names.length}</b> member(s): ${names.slice(0, 6).map(esc).join(', ')}${names.length > 6 ? '…' : ''}. I folded each one's facts and evidence into their member profile and merged shared issues up to the class level. Here's how the class looks:`);
    const a = cfClassAnalysis(); cfAddMsg('bot', a.html, a.actions);
  } catch (_) {}
}
const CF_CLASS_PRIMER = `CLASS ACTION PRIMER (U.S.). To certify a class:
FEDERAL — FRCP 23(a): (1) Numerosity — class so numerous that joinder is impracticable (often ~40+). (2) Commonality — questions of law or fact common to the class. (3) Typicality — the representatives' claims are typical of the class. (4) Adequacy — the reps and counsel will fairly and adequately protect the class. PLUS one of Rule 23(b): (b)(1) risk of inconsistent/ dispositive separate actions; (b)(2) defendant acted on grounds applying generally, so injunctive/declaratory relief fits the whole class; (b)(3) common questions PREDOMINATE over individual ones AND a class action is SUPERIOR (requires notice and opt-out).
NEW YORK — CPLR Article 9 (§901(a)): numerosity, predominance of common questions, typicality, adequacy, and superiority. §902 adds discretionary factors (members' interest in individual control, existing litigation, desirability of the forum, manageability). IMPORTANT §901(b): a class action may NOT seek a statutory penalty or minimum/multiple damages unless the statute expressly authorizes class recovery.
WHAT STRENGTHENS A CLASS: a single common course of conduct affecting all members the same way; common/documentary proof that applies class-wide; typical named representatives with no conflicts of interest; a clearly defined, ascertainable class (and clean subgroups); damages provable on a class-wide or formulaic basis; and manageability. The biggest threat is individualized issues that defeat predominance — flag them and consider subclasses.`;
function cfClassManageGuide(q) {
  let html, actions;
  if (/\b(import|backup|backups|bulk|several|many|build class|from caseframe)\b/.test(q)) {
    html = 'To build the class from existing Caseframe files:<ul class="cf-reslist">'
      + '<li>Open the <b>Member directory</b>.</li>'
      + '<li><b>⇪ Import member</b> turns one person’s Caseframe backup into a single member profile — their facts and evidence come in attached to them.</li>'
      + '<li><b>⇪⇪ Build class from backups</b> imports several at once: each becomes a member, and shared issues, authorities and theories merge up to the class level. Encrypted backups ask for each passphrase.</li>'
      + '<li>Right after an import I’ll show a class snapshot so you can see where certification stands.</li></ul>';
    actions = [{ label: 'Open Member directory', action: 'go', arg: 'members' }];
  } else if (/\b(evidence|exhibit|document|docs|upload|photo of|file)\b/.test(q)) {
    html = 'To attach evidence to a specific member:<ul class="cf-reslist">'
      + '<li>Open the <b>Member directory</b> and click a member to open their profile.</li>'
      + '<li>Use <b>＋ Upload</b> in their evidence panel — anything you add while on their profile is tagged to that member.</li>'
      + '<li>Each member’s exhibits also roll up into the case-wide <b>Evidence</b> view, so you can see the whole class’s proof at once.</li></ul>';
    actions = [{ label: 'Open Member directory', action: 'go', arg: 'members' }];
  } else {
    html = 'Managing the class roster:<ul class="cf-reslist">'
      + '<li><b>Add member</b> (sidebar or the directory) opens a form for name, photo + description, email, phone, claim ref, status, and a short bio.</li>'
      + '<li>Set each member’s <b>status</b> — prospective, opt-in, named rep, opt-out — and group members into <b>subgroups</b> for distinct cohorts.</li>'
      + '<li>Open any member to record <b>their facts</b> and <b>their evidence</b>; a per-member “Fit to the class” readout shows what’s still missing.</li>'
      + '<li>Search and filter the directory by status or subgroup — it’s built to scale to 100+ members.</li></ul>';
    actions = [{ label: 'Add member', action: 'addMember' }, { label: 'Open Member directory', action: 'go', arg: 'members' }];
  }
  return { html, actions };
}
function cfClassAnalysis() {
  const n = S.members.length;
  const named = S.members.filter(m => /named rep/i.test(m.status || '')).length;
  const optin = S.members.filter(m => /opt-in|named rep/i.test(m.status || '')).length;
  const issueMembers = i => new Set(S.facts.filter(f => f.memberId && f.issueIds.includes(i.id)).map(f => f.memberId)).size;
  const common = S.issues.map(i => ({ i, c: issueMembers(i) })).filter(x => x.c >= 2).sort((a, b) => b.c - a.c);
  let html = '<b>Class snapshot</b> — grounded in your members (not legal advice).';
  html += '<div class="cf-sub">Numerosity</div><ul class="cf-reslist"><li>' + n + ' member' + (n === 1 ? '' : 's') + ' so far. ' + (n >= 40 ? 'Comfortably supports numerosity (classes of ~40+ are routinely certified).' : n >= 20 ? 'Approaching the range courts accept — more members strengthens it.' : 'Likely too few on its own; add members or be ready to show joinder is impracticable.') + '</li></ul>';
  html += '<div class="cf-sub">Commonality</div>' + (common.length ? '<ul class="cf-reslist">' + common.slice(0, 6).map(x => `<li><b>${esc(x.i.name)}</b> — shared by ${x.c} members</li>`).join('') + '</ul>' : '<div class="ministat">No issue is shared across ≥2 members yet. Link each member’s facts to the class issues so common questions emerge.</div>');
  html += '<div class="cf-sub">Typicality & adequacy</div><ul class="cf-reslist"><li>' + (named ? `${named} named representative(s) designated — confirm their claims are typical and conflict-free.` : 'No <b>named representative</b> yet — set at least one member’s status to “Named rep.”') + '</li><li>' + optin + ' member(s) opted in / named.</li></ul>';
  html += '<div class="cf-sub">Which framework?</div><ul class="cf-reslist"><li><b>Federal (FRCP 23):</b> satisfy all of 23(a) + a 23(b) category — usually 23(b)(3): predominance + superiority.</li><li><b>New York (CPLR Art. 9):</b> §901 factors + §902 discretion; mind §901(b)’s bar on statutory-penalty class claims.</li></ul>';
  html += '<div class="cf-note">General standards for building a class — not legal advice. Verify current Rule 23 / CPLR Art. 9 text and case law for your court.</div>';
  const actions = [{ label: 'Members', action: 'go', arg: 'members' }];
  if (typeof window.__CF_LLM === 'function') actions.push({ label: 'Deep class analysis (AI)', action: '_classdeep' });
  return { html, actions };
}
async function cfClassDeep() {
  if (typeof window.__CF_LLM !== 'function') return;
  const id = cfAddMsg('bot', '<span class="cf-typing">Analyzing the class…</span>');
  const digest = cfCaseDigest() + '\nCLASS: ' + S.members.length + ' members; named reps: ' + S.members.filter(m => /named rep/i.test(m.status || '')).length + '. Subgroups: ' + (S.groups.map(g => g.name).join(', ') || 'none') + '.';
  try {
    const reply = await window.__CF_LLM({ system: "You are Caseframe's class-action strategist. Using ONLY the data provided, assess the putative class against certification requirements (numerosity, commonality, typicality, adequacy, predominance, superiority) under both federal FRCP 23 and New York CPLR Article 9. Give concrete steps to strengthen certification and how to structure subgroups. Do NOT invent facts, members, cases, or citations.", context: CF_CLASS_PRIMER + '\n' + cfPrimer(), question: digest });
    cfReplaceMsg(id, reply ? cfFmt(reply) + '<div class="cf-note">General guidance, not legal advice. Confirm current Rule 23 / CPLR Art. 9 requirements for your court.</div>' : 'Could not analyze.');
  } catch (e) { cfReplaceMsg(id, 'Could not analyze.'); }
}

function injectResearchNav() {
  const nav = document.getElementById('nav');
  if (!nav || document.querySelector('.navitem[data-view="research"]')) return;
  const b = document.createElement('button');
  b.className = 'navitem'; b.dataset.view = 'research'; b.dataset.min = '1';
  b.setAttribute('data-help', 'Search an offline library of statutes, cases, and legal terms in plain language, then link any authority to your facts, issues, and theories.');
  b.innerHTML = '<span class="ico">§</span>Research<span class="count" id="c-research"></span>';
  b.onclick = () => { S.view = 'research'; render(); };
  const after = nav.querySelector('[data-view="map"]') || nav.querySelector('[data-view="theory"]');
  if (after) after.insertAdjacentElement('afterend', b); else nav.appendChild(b);
}
function bindGlobal() {
  injectClassNav();
  injectResearchNav();
  injectSearchWidget();
  injectEvidenceCSS();
  injectExportBtn();
  injectAssistant();
  // In the desktop app, hand external links to the system browser (the WebView ignores them otherwise).
  document.addEventListener('click', e => {
    const a = e.target.closest('a[href]'); if (!a) return;
    const href = a.getAttribute('href') || '';
    if (/^https?:\/\//i.test(href) && typeof window.__CF_OPEN === 'function') { e.preventDefault(); window.__CF_OPEN(href).catch(() => {}); }
  }, true);
  $('#capture').addEventListener('input', renderCapturePreview);
  $('#capture').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); commitCapture(); } });
  $('#captureSave').onclick = commitCapture;
  $('#search').addEventListener('input', e => { S.filter.q = e.target.value.trim().toLowerCase(); render(); });
  document.querySelectorAll('.navitem[data-view]').forEach(b => b.onclick = () => { S.view = b.dataset.view; S.filter = { q: S.filter.q }; $('#side').classList.remove('open'); render(); });
  document.querySelectorAll('.navitem[data-manage]').forEach(b => b.onclick = () => openManage(b.dataset.manage));
  document.querySelectorAll('#lens [data-lens]').forEach(b => b.onclick = async () => { S.lens = b.dataset.lens; await Store.meta.put({ id: 'lens', v: S.lens }); $('#side').classList.remove('open'); render(); });
  $('#uploadBtn').onclick = () => $('#files').click();
  $('#files').onchange = e => { handleFiles(e.target.files); e.target.value = ''; };
  $('#backupBtn').onclick = doBackup;
  $('#restoreBtn').onclick = () => $('#restoreFile').click();
  $('#restoreFile').onchange = e => { if (e.target.files[0]) doRestore(e.target.files[0]); e.target.value = ''; };
  if ($('#mergeBtn')) $('#mergeBtn').onclick = () => $('#mergeFile').click();
  if ($('#mergeFile')) $('#mergeFile').onchange = e => { if (e.target.files[0]) doMerge(e.target.files[0]); e.target.value = ''; };
  $('#hamburger').onclick = () => $('#side').classList.toggle('open');
  // drag & drop evidence
  let dragN = 0; const hint = $('#dropHint');
  window.addEventListener('dragenter', e => { if (e.dataTransfer && [...e.dataTransfer.types].includes('Files')) { dragN++; hint.classList.add('show'); } });
  window.addEventListener('dragover', e => { if (hint.classList.contains('show')) e.preventDefault(); });
  window.addEventListener('dragleave', () => { if (--dragN <= 0) { dragN = 0; hint.classList.remove('show'); } });
  window.addEventListener('drop', e => { e.preventDefault(); dragN = 0; hint.classList.remove('show'); if (e.dataTransfer.files.length) handleFiles(e.dataTransfer.files); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
  setupHelp();
}
