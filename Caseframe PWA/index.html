<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Caseframe</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#7b2d3a">
<link rel="apple-touch-icon" href="icon.svg">
<style>
:root{
  --paper:#f6f3ec; --panel:#fffdf8; --panel2:#fbf8f1; --ink:#211f1b; --ink-soft:#453f38;
  --muted:#7c746a; --faint:#9a9389; --line:#e6ddcf; --line2:#efe8db;
  --accent:#7b2d3a; --accent-ink:#fff; --teal:#1f6b5b; --teal-soft:#e7f1ee;
  --ok:#2f7d5b; --ok-bg:#e7f1ea; --warn:#9a7b2e; --warn-bg:#f6efdc; --bad:#b1503c; --bad-bg:#f8e9e4;
  --nav:#201d19; --nav-soft:#2d2823; --nav-line:#3a342d; --nav-ink:#d9cfc0;
  --shadow:0 10px 30px rgba(40,32,20,.10); --radius:12px;
  --serif:ui-serif,"Iowan Old Style","Palatino Linotype",Georgia,serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font:14px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none}
::selection{background:#e9d9c4}

.shell{display:grid;grid-template-columns:244px 1fr;min-height:100vh}

/* sidebar */
.side{background:var(--nav);color:var(--nav-ink);display:flex;flex-direction:column;gap:22px;padding:18px 14px 16px}
.brand{display:flex;align-items:center;gap:10px;color:#fff;font:600 18px/1 var(--serif);letter-spacing:.01em;padding:2px 6px}
.mark{width:30px;height:30px;border-radius:9px;background:var(--accent);color:#fff;display:grid;place-items:center;font:700 15px/1 var(--sans)}
.matterbox{background:var(--nav-soft);border:1px solid var(--nav-line);border-radius:10px;padding:11px 12px}
.matterbox .eyebrow{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:#9a8f7f;font-weight:700}
.matterbox strong{display:block;color:#fff;font:600 14px/1.3 var(--serif);margin:3px 0 4px}
.matterbox .meta{font-size:11px;color:#a79c8c;line-height:1.45}
.matterbox button{color:#c9bdab;font-size:11px;font-weight:600;margin-top:7px;padding:0}
.matterbox button:hover{color:#fff}
.nav{display:flex;flex-direction:column;gap:2px}
.navlabel{padding:12px 10px 5px;font-size:9.5px;text-transform:uppercase;letter-spacing:.13em;color:#8c8171;font-weight:700}
.navitem{display:flex;align-items:center;gap:11px;width:100%;text-align:left;padding:9px 10px;border-radius:8px;color:var(--nav-ink);font-size:13px}
.navitem .ico{width:16px;text-align:center;opacity:.8;font-size:13px}
.navitem .count{margin-left:auto;font-size:11px;color:#a99e8d;background:#00000026;padding:1px 7px;border-radius:20px;min-width:20px;text-align:center}
.navitem:hover{background:#ffffff10}
.navitem.active{background:var(--accent);color:#fff}
.navitem.active .count{background:#ffffff2e;color:#fff}
.sidefoot{margin-top:auto;display:flex;flex-direction:column;gap:7px}
.fine{color:#8f8574;font-size:10.5px;line-height:1.45;margin:6px 2px 0}

/* buttons */
.primary{background:var(--accent);color:#fff;border-radius:8px;padding:9px 15px;font-weight:600;white-space:nowrap}
.primary:hover{background:#6a2531}
.ghost{background:var(--panel);border:1px solid var(--line);color:var(--ink-soft);border-radius:8px;padding:8px 12px;font-weight:600}
.ghost:hover{background:#fff;border-color:#d8cdb9}
.ghost.sm{padding:7px 10px;font-size:12.5px}
.side .ghost{background:#2b2621;border-color:#3c362e;color:#d8cdbc}
.side .ghost:hover{background:#352f28}
.linkbtn{color:var(--teal);font-weight:600;font-size:12px;padding:0}
.linkbtn:hover{text-decoration:underline}
.danger{color:var(--bad)}

/* main */
.main{min-width:0;display:flex;flex-direction:column}
.topbar{height:60px;background:var(--panel);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:0 24px;position:sticky;top:0;z-index:5}
.hamburger{display:none;font-size:20px;color:var(--ink-soft)}
.search-wrap{flex:1;max-width:520px}
.search{width:100%;background:var(--paper);border:1px solid var(--line);border-radius:9px;padding:9px 12px;outline:none}
.search:focus,input:focus,select:focus,textarea:focus{border-color:#b98a92;box-shadow:0 0 0 3px #7b2d3a1a}
.right{margin-left:auto;display:flex;gap:8px}

.content{padding:22px 24px 70px;max-width:1240px;width:100%;margin:0 auto}

/* capture */
.capture{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:12px;display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}
.capture-input{width:100%;border:1px solid var(--line);border-radius:9px;padding:12px 13px;font-size:15px;background:var(--panel2)}
.capture-preview{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px;align-items:center;min-height:0;color:var(--muted);font-size:12px}
.capture-preview:empty{display:none}
.capture-preview .pills{display:flex;flex-wrap:wrap;gap:6px}

/* chips */
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:20px;padding:3px 10px;font-size:11.5px;font-weight:600;border:1px solid var(--line);background:var(--panel2);color:var(--ink-soft);white-space:nowrap}
.chip.person{background:#eef1f6;border-color:#dde3ee;color:#3f5578}
.chip.issue{background:var(--teal-soft);border-color:#cfe6e0;color:#1d685a}
.chip.tag{background:#f3eef7;border-color:#e4daee;color:#6a5090}
.chip.date{background:#f3efe6;border-color:#e7ddc9;color:#7a6a46}
.chip.ev{background:#fff;border-color:#dcd2c0;color:#6b5f49;cursor:pointer}
.chip.ev:hover{border-color:var(--accent);color:var(--accent)}
.chip.mini{padding:2px 8px;font-size:10.5px}
.status{display:inline-flex;align-items:center;gap:5px;border-radius:20px;padding:3px 9px;font-size:11px;font-weight:700}
.status:before{content:"";width:6px;height:6px;border-radius:50%}
.status.Supported{background:var(--ok-bg);color:var(--ok)}
.status.Supported:before{background:var(--ok)}
.status.Disputed{background:var(--bad-bg);color:var(--bad)}
.status.Disputed:before{background:var(--bad)}
.status.Unverified{background:var(--warn-bg);color:var(--warn)}
.status.Unverified:before{background:var(--warn)}

/* stat row */
.statrow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:18px 0}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:14px 16px;box-shadow:var(--shadow)}
.stat .label{color:var(--muted);font-size:12px}
.stat strong{display:block;font:600 24px/1 var(--serif);margin-top:5px}
.stat small{color:var(--faint);font-size:11px}

/* view head + filters */
.viewhead{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin:6px 2px 10px}
.viewhead h1{font:600 21px/1.2 var(--serif);margin:0;letter-spacing:-.01em}
.viewhead .sub{color:var(--muted);font-size:12.5px}
.filters{display:flex;flex-wrap:wrap;gap:7px;align-items:center;margin-bottom:14px}
.fchip{border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:20px;padding:5px 11px;font-size:11.5px;font-weight:600}
.fchip:hover{border-color:#d8cdb9}
.fchip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.fchip.clear{margin-left:auto;color:var(--teal);border-color:transparent;background:none}

/* generic cards/panels */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.empty{padding:46px 20px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font:600 16px/1 var(--serif);margin-bottom:6px}

/* timeline */
.tl{display:flex;flex-direction:column}
.tl-group{padding:4px 0}
.tl-grouphd{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--faint);font-weight:700;padding:14px 2px 6px}
.fact{display:grid;grid-template-columns:104px 1fr;gap:14px;padding:14px;border:1px solid var(--line);border-radius:11px;background:var(--panel);box-shadow:var(--shadow);margin-bottom:10px;position:relative}
.fact .when{color:var(--muted);font-size:12px}
.fact .when .prec{display:block;color:var(--faint);font-size:10.5px;margin-top:2px}
.fact .body{min-width:0}
.fact .title{font:500 15.5px/1.42 var(--serif);color:var(--ink);margin:0 0 8px}
.fact .meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.fact .evrow{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.fact .acts{position:absolute;top:12px;right:12px;display:flex;gap:4px;opacity:0;transition:.12s}
.fact:hover .acts{opacity:1}
.iconbtn{width:26px;height:26px;border-radius:7px;border:1px solid var(--line);color:var(--muted);display:grid;place-items:center;font-size:13px;background:var(--panel)}
.iconbtn:hover{border-color:var(--accent);color:var(--accent)}

/* lists for issue/person/evidence */
.grouplist{display:flex;flex-direction:column;gap:14px}
.gcard{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.gcard .ghd{display:flex;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid var(--line2);background:var(--panel2)}
.gcard .ghd h3{margin:0;font:600 15px/1.2 var(--serif)}
.gcard .ghd .pills{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap}
.gcard .gbody{padding:6px 16px 12px}
.ministat{font-size:11px;color:var(--muted)}
.warnline{color:var(--bad);font-size:12px;font-weight:600;padding:10px 16px;background:var(--bad-bg);border-bottom:1px solid #f0d9d1}
.rowfact{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-top:1px solid var(--line2)}
.rowfact:first-child{border-top:none}
.rowfact .rf-date{color:var(--faint);font-size:11px;white-space:nowrap;padding-top:2px;min-width:74px}
.rowfact .rf-title{font-size:13.5px;line-height:1.4}
.rowfact .rf-title .q{color:var(--muted);font-size:12px}

/* avatars */
.av{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:10.5px;font-weight:700;color:#5a4a2e;background:#efe6d4;flex:none}

/* matrix */
.matrix-wrap{overflow:auto}
.data-table{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.data-table th,.data-table td{text-align:left;padding:11px 14px;border-bottom:1px solid var(--line2);font-size:13px}
.data-table thead th{background:var(--panel2);font:600 12px/1 var(--sans);color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.data-table tbody tr:last-child td{border-bottom:none}
.data-table td.n{text-align:center;font-weight:600}
.cellbtn{display:inline-grid;place-items:center;min-width:34px;padding:3px 8px;border-radius:7px;font-weight:700}
.cellbtn.z{color:var(--faint);font-weight:500}
.cellbtn.ok{background:var(--ok-bg);color:var(--ok)}
.cellbtn.bad{background:var(--bad-bg);color:var(--bad)}
.cellbtn.warn{background:var(--warn-bg);color:var(--warn)}
.cellbtn.ev{background:#f1ece2;color:#6b5f49}

/* modal */
.modal-root{position:fixed;inset:0;display:none;align-items:flex-start;justify-content:center;padding:36px 16px;background:#20201c66;backdrop-filter:blur(2px);z-index:40;overflow:auto}
.modal-root.show{display:flex}
.modal{width:min(620px,100%);background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:0 30px 80px rgba(30,24,14,.4);overflow:hidden}
.modal.wide{width:min(860px,100%)}
.modalhd{padding:18px 20px 14px;border-bottom:1px solid var(--line);display:flex;align-items:flex-start;gap:12px}
.modalhd h2{margin:0;font:600 19px/1.2 var(--serif)}
.modalhd p{margin:3px 0 0;color:var(--muted);font-size:12px}
.modalhd .x{margin-left:auto;width:30px;height:30px;border-radius:50%;background:#00000010;color:#555;font-size:17px}
.modalhd .x:hover{background:#00000020}
.mbody{padding:18px 20px;display:grid;grid-template-columns:1fr 1fr;gap:13px;max-height:64vh;overflow:auto}
.field{display:grid;gap:5px}
.field.full{grid-column:1/-1}
.field label{font-size:11px;font-weight:700;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.04em}
.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:9px 10px;background:var(--panel2);outline:none}
.field textarea{min-height:78px;resize:vertical;font:inherit}
.field .hint{font-size:11px;color:var(--faint)}
.modalfoot{padding:13px 20px 18px;display:flex;gap:8px;justify-content:flex-end;border-top:1px solid var(--line)}

/* evidence viewer */
.ev-view{grid-column:1/-1;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:12px;display:grid;gap:10px;place-items:center;min-height:120px}
.ev-view img{max-width:100%;max-height:52vh;border-radius:7px}
.ev-view video{max-width:100%;max-height:52vh;border-radius:7px;background:#000}
.ev-view audio{width:100%}
.ev-view pre{white-space:pre-wrap;font:12.5px/1.5 ui-monospace,Menlo,Consolas,monospace;width:100%;max-height:52vh;overflow:auto;margin:0;color:var(--ink-soft)}
.ev-view iframe{width:100%;height:56vh;border:none;background:#fff;border-radius:7px}
.ev-noview{color:var(--muted);text-align:center;font-size:13px;padding:20px}
.ev-meta{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px}
.cited-list{grid-column:1/-1;display:flex;flex-direction:column;gap:7px}

.manage-list{grid-column:1/-1;display:flex;flex-direction:column;gap:7px;max-height:48vh;overflow:auto}
.manage-row{display:flex;align-items:center;gap:10px;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:var(--panel2)}
.manage-row input.inl{border:1px solid transparent;background:none;flex:1;padding:4px 6px;border-radius:6px}
.manage-row input.inl:focus{background:#fff;border-color:var(--line)}
.manage-row select.inl{border:1px solid var(--line);background:#fff;border-radius:6px;padding:4px 6px;font-size:12px}
.addrow{display:flex;gap:8px;grid-column:1/-1;margin-top:4px}
.addrow input{flex:1}

/* toast + drop */
.toast{position:fixed;bottom:66px;left:50%;transform:translateX(-50%) translateY(8px);background:var(--nav);color:#fff;padding:10px 16px;border-radius:9px;box-shadow:var(--shadow);opacity:0;transition:.2s;pointer-events:none;z-index:60;font-size:13px}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.drop-hint{position:fixed;inset:0;display:none;place-items:center;background:#7b2d3acc;color:#fff;font:600 22px/1 var(--serif);z-index:70}
.drop-hint.show{display:grid}

@media(max-width:980px){
  .statrow{grid-template-columns:1fr 1fr}
  .mbody{grid-template-columns:1fr}
}
@media(max-width:720px){
  .shell{grid-template-columns:1fr}
  .side{position:fixed;left:0;top:0;bottom:0;width:244px;z-index:50;transform:translateX(-100%);transition:.2s}
  .side.open{transform:none}
  .hamburger{display:block}
  .capture{grid-template-columns:1fr}
  .fact{grid-template-columns:1fr}
  .fact .when{order:2;color:var(--faint)}
  .content{padding:16px 14px 70px}
}

/* ===== Theories feature add-on ===== */
/* view-depth (lens) switch */
.lens{display:flex;flex-direction:column;gap:6px}
.lens-label{font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:#8c8171;font-weight:700;padding:0 4px}
.lens-opts{display:flex;background:var(--nav-soft);border:1px solid var(--nav-line);border-radius:9px;padding:3px;gap:2px}
.lens-opts button{flex:1;padding:6px 4px;border-radius:7px;color:#b9ad9c;font-size:11px;font-weight:600}
.lens-opts button:hover{color:#fff}
.lens-opts button.on{background:var(--accent);color:#fff}

/* theory chip */
.chip.theory{background:#faf0dd;border-color:#eeddba;color:#8a6a1f;cursor:pointer}
.chip.theory:hover{border-color:#caa23f}

/* theory cards */
.theory-sum{color:var(--muted);font-size:12.5px;margin:0 0 2px}
.theory-narr{font-size:13px;line-height:1.55;color:var(--ink-soft);white-space:pre-wrap;margin:8px 0 2px;padding:10px 12px;background:var(--panel2);border:1px solid var(--line2);border-radius:9px}
.connect-block{margin-top:10px}
.connect-block .cb-label{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);margin:0 0 5px}
.connect-chips{display:flex;flex-wrap:wrap;gap:6px}
.warnline{color:var(--warn);background:var(--warn-bg);border-radius:8px;padding:7px 11px;font-size:12px;font-weight:600;margin:6px 0}

/* multi-select chip connector */
.chips-field{display:flex;flex-wrap:wrap;gap:6px;align-items:center;border:1px solid var(--line);background:#fff;border-radius:9px;padding:6px 8px;min-height:40px}
.chips-field:focus-within{border-color:var(--accent)}
.mchip{display:inline-flex;align-items:center;gap:6px;background:var(--panel2);border:1px solid var(--line);border-radius:20px;padding:3px 6px 3px 10px;font-size:12px;font-weight:600;color:var(--ink-soft)}
.mchip button{color:var(--muted);font-weight:700;line-height:1;padding:0 2px;border-radius:50%}
.mchip button:hover{color:var(--bad)}
.chips-input{flex:1;min-width:120px;border:none;outline:none;background:none;padding:4px 2px;font-size:13px}
.chips-wrap{position:relative}
.chips-dd{position:absolute;left:0;right:0;z-index:30;margin-top:4px;background:#fff;border:1px solid var(--line);border-radius:9px;box-shadow:var(--shadow);max-height:220px;overflow:auto;padding:4px}
.chips-dd button{display:block;width:100%;text-align:left;padding:8px 10px;border-radius:7px;font-size:13px;color:var(--ink)}
.chips-dd button:hover{background:var(--panel2)}
.chips-dd button[data-create]{color:var(--teal);font-weight:600;border-top:1px solid var(--line2)}
.chips-empty{padding:9px 10px;color:var(--faint);font-size:12.5px}

/* connection map */
.map-wrap{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.map-toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 14px;border-bottom:1px solid var(--line2);background:var(--panel2);font-size:12px;color:var(--muted)}
.map-legend{display:flex;gap:12px;flex-wrap:wrap;margin-left:auto}
.map-legend span{display:inline-flex;align-items:center;gap:6px;font-weight:600}
.map-legend i{width:11px;height:11px;border-radius:50%;display:inline-block}
.map-svg{display:block;width:100%;height:62vh;background:
  radial-gradient(circle at 1px 1px, #e9e1d2 1px, transparent 0) 0 0/22px 22px}
.map-svg .edge{stroke:#ccbfa8;stroke-width:1.4}
.map-svg .edge.cite{stroke:#d8c7a0;stroke-dasharray:4 3}
.map-svg .node{cursor:grab}
.map-svg .node:active{cursor:grabbing}
.map-svg .node circle{stroke:#fff;stroke-width:2}
.map-svg .node text{font:600 11px var(--sans);fill:var(--ink);pointer-events:none}
.n-theory circle{fill:#caa23f}
.n-fact circle{fill:#7b2d3a}
.n-evidence circle{fill:#1f6b5b}
.n-issue circle{fill:#3f5578}
.n-person circle{fill:#6b5f49}
.map-empty{padding:40px;text-align:center;color:var(--muted)}
.connpanel{display:contents}

/* header controls + horizontal timeline */
.headctl{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.seg{display:inline-flex;background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:3px;gap:2px}
.seg button{padding:6px 12px;border-radius:7px;font-size:12.5px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--accent);color:#fff}
.selctl{border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px 10px;font-size:13px;font-family:inherit;color:var(--ink)}
.tlh{overflow-x:auto;overflow-y:hidden;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.tlh-inner{min-width:max-content}
.tlh-row{display:flex;align-items:stretch;border-bottom:1px solid var(--line2)}
.tlh-row:last-child{border-bottom:none}
.tlh-row.axisrow{position:sticky;top:0;z-index:4;background:var(--panel2)}
.tl-lanehd{position:sticky;left:0;z-index:3;width:168px;min-width:168px;background:var(--panel);border-right:1px solid var(--line);border-left:4px solid var(--line);padding:12px 12px;display:flex;align-items:center;gap:8px}
.tl-lanehd b{font-size:12.5px;font-weight:600;line-height:1.25}
.tl-lanehd.axisblank{background:var(--panel2);border-left-color:transparent}

<script>
/* ============================================================
   Caseframe — local-first case workspace (Phase 0)
   Storage layer is isolated in `Store` so it can later be
   swapped for a PHP/MariaDB API with no change to the UI.
   ============================================================ */

/* ---------- Storage (IndexedDB; swappable) ---------- */
const Store = (() => {
  const NAME = 'caseframe-v2', STORES = ['facts','evidence','people','issues','tags','citations','theories','authorities','members','groups','meta'];
  let db;
  const open = () => new Promise((res, rej) => {
    const r = indexedDB.open(NAME, 4);
    r.onupgradeneeded = () => { const d = r.result; STORES.forEach(s => { if (!d.objectStoreNames.contains(s)) d.createObjectStore(s, { keyPath: 'id' }); }); };
    r.onsuccess = () => { db = r.result; res(db); };
    r.onerror = () => rej(r.error);
  });
  const p = r => new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
  const os = (s, m) => db.transaction(s, m).objectStore(s);
  const api = { open };
  STORES.forEach(s => api[s] = {
    all: () => p(os(s, 'readonly').getAll()),
    get: id => p(os(s, 'readonly').get(id)),
    count: () => p(os(s, 'readonly').count()),
    put: v => p(os(s, 'readwrite').put(v)),
    bulkPut: arr => new Promise((res, rej) => {
      if (!arr || !arr.length) return res(0);
      const tx = db.transaction(s, 'readwrite'), st = tx.objectStore(s);
      for (const v of arr) st.put(v);
      tx.oncomplete = () => res(arr.length); tx.onerror = () => rej(tx.error); tx.onabort = () => rej(tx.error);
    }),
    del: id => p(os(s, 'readwrite').delete(id)),
    clear: () => p(os(s, 'readwrite').clear())
  });
  return api;
})();

/* ---------- State + helpers ---------- */
const S = { facts: [], evidence: [], people: [], issues: [], tags: [], citations: [], theories: [], authorities: [], members: [], groups: [], matter: null,
  view: 'timeline', sortDesc: true, filter: {}, lens: 'standard', tlLayout: 'vertical', tlFocus: 'fact',
  researchQ: '', researchState: 'all', researchType: 'all', researchTab: 'results', _classMode: false };
// The in-app authorities library is a *focused* set (glossary + what you cite). Big
// corpora belong in the bundled SQLite database, which is searched in place and stays fast.
const AUTH_CAP = 8000;
const $ = s => document.querySelector(s);
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : 'id-' + Date.now() + '-' + Math.random().toString(36).slice(2));
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uniq = a => [...new Set(a.map(x => x.trim()).filter(Boolean))];
const pad = n => String(n).padStart(2, '0');
const iso = (y, m, d) => `${y}-${pad(m + 1)}-${pad(d)}`;
const todayISO = () => new Date().toISOString().slice(0, 10);
let toastTimer;
function toast(t) { const n = $('#toast'); n.textContent = t; n.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => n.classList.remove('show'), 2600); }

const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function fmtDate(d, prec) {
  if (!d) return '—';
  const [y, m, day] = d.split('-').map(Number);
  if (prec === 'year') return `${y}`;
  if (prec === 'month') return `${MONTHS[m - 1]} ${y}`;
  const base = `${MONTHS[m - 1]} ${day}, ${y}`;
  return prec === 'before' ? `Before ${base}` : base;
}
const PALETTE = ['#efe6d4|#5a4a2e', '#eef1f6|#3f5578', '#edf2e8|#5a6f44', '#f5e9e7|#9c5b50', '#f1ecf6|#6a5090', '#e7f1ee|#1d685a'];
function avatarStyle(name) { let h = 0; for (const c of name) h = (h * 31 + c.charCodeAt(0)) >>> 0; const [bg, fg] = PALETTE[h % PALETTE.length].split('|'); return `background:${bg};color:${fg}`; }
function initials(name) { const p = name.trim().split(/\s+/); return ((p[0]?.[0] || '') + (p[1]?.[0] || '')).toUpperCase() || name.slice(0, 2).toUpperCase(); }

/* lookups */
const byId = (arr, id) => arr.find(x => x.id === id);
const personName = id => (byId(S.people, id) || {}).name || '—';
const issueName = id => (byId(S.issues, id) || {}).name || '—';
const tagName = id => (byId(S.tags, id) || {}).name || '—';
const theoryName = id => (byId(S.theories, id) || {}).name || '—';
const authorityName = id => (byId(S.authorities, id) || {}).name || '—';
const citesFor = fid => S.citations.filter(c => c.factId === fid);
const citesOf = eid => S.citations.filter(c => c.evidenceId === eid);
const theoriesForFact = fid => S.theories.filter(t => (t.factIds || []).includes(fid));
const theoriesForEvidence = eid => S.theories.filter(t => (t.evidenceIds || []).includes(eid));
const short = (s, m = 42) => { s = String(s == null ? '' : s); return s.length > m ? s.slice(0, m - 1) + '…' : s; };

async function findOrCreate(kind, name, extra = {}) {
  const arr = S[kind]; const n = name.trim(); if (!n) return null;
  let hit = arr.find(x => x.name.toLowerCase() === n.toLowerCase());
  if (hit) return hit.id;
  const rec = { id: uid(), name: n, ...extra };
  arr.push(rec); await Store[kind].put(rec);
  return rec.id;
}

/* ---------- Interrelated dropdown connector (multi-select chips) ---------- */
function makeChips(mount, kind, ids, opts = {}) {
  const state = { ids: (ids || []).slice() };
  mount.classList.add('chips-wrap');
  const labelOf = id => {
    const r = byId(S[kind], id); if (!r) return '—';
    return kind === 'facts' ? `${fmtDate(r.date, r.precision)} · ${r.title}` : (r.name || r.title || '—');
  };
  function draw() {
    mount.innerHTML = '';
    const field = document.createElement('div'); field.className = 'chips-field';
    state.ids.forEach(id => {
      const c = document.createElement('span'); c.className = 'mchip';
      c.innerHTML = `${esc(short(labelOf(id), 38))} <button type="button" aria-label="Remove">×</button>`;
      c.querySelector('button').onclick = () => { state.ids = state.ids.filter(x => x !== id); draw(); };
      field.appendChild(c);
    });
    const inp = document.createElement('input'); inp.className = 'chips-input'; inp.placeholder = opts.placeholder || 'Type to search or add…';
    if (opts.help) inp.setAttribute('data-help', opts.help);
    field.appendChild(inp);
    const dd = document.createElement('div'); dd.className = 'chips-dd'; dd.style.display = 'none';
    mount.appendChild(field); mount.appendChild(dd);
    const matches = q => {
      const ql = q.toLowerCase().trim();
      let items = S[kind].filter(r => !state.ids.includes(r.id)).map(r => ({ id: r.id, label: labelOf(r.id) }));
      if (ql) items = items.filter(o => o.label.toLowerCase().includes(ql));
      return items.slice(0, 10);
    };
    const openDD = () => {
      const q = inp.value, items = matches(q);
      let html = items.map(o => `<button type="button" data-id="${esc(o.id)}">${esc(short(o.label, 48))}</button>`).join('');
      const exists = S[kind].some(r => (r.name || r.title || '').toLowerCase() === q.trim().toLowerCase());
      if (opts.allowCreate !== false && q.trim() && !exists)
        html += `<button type="button" data-create="1">+ Create “${esc(short(q.trim(), 40))}”</button>`;
      dd.innerHTML = html || '<div class="chips-empty">No matches</div>';
      dd.style.display = 'block';
      dd.querySelectorAll('[data-id]').forEach(b => b.onmousedown = e => { e.preventDefault(); state.ids.push(b.dataset.id); draw(); setTimeout(() => mount.querySelector('.chips-input')?.focus(), 0); });
      const cb = dd.querySelector('[data-create]');
      if (cb) cb.onmousedown = async e => { e.preventDefault(); const id = await findOrCreate(kind, inp.value.trim(), kind === 'people' ? { role: 'Other' } : {}); if (id) state.ids.push(id); draw(); setTimeout(() => mount.querySelector('.chips-input')?.focus(), 0); };
    };
    inp.addEventListener('focus', openDD);
    inp.addEventListener('input', openDD);
    inp.addEventListener('blur', () => setTimeout(() => { dd.style.display = 'none'; }, 160));
    inp.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); const first = dd.querySelector('[data-id],[data-create]'); if (first) first.dispatchEvent(new MouseEvent('mousedown')); } });
  }
  draw();
  return { getIds: () => state.ids.slice() };
}

/* ---------- Universal connections (link any type to any type) ----------
   Connections are stored on the existing per-record arrays (and citations for
   fact↔evidence) so every current view keeps working with no data migration.
   PAIRHOST maps an unordered type pair to [hostType, field, valType]: the link
   lives in `hostRecord[field]` as the id of the non-host type. */
const STOREFOR = { person: 'people', fact: 'facts', issue: 'issues', theory: 'theories', evidence: 'evidence', tag: 'tags', authority: 'authorities' };
const KIND2TYPE = { people: 'person', facts: 'fact', issues: 'issue', theories: 'theory', evidence: 'evidence', tags: 'tag', authorities: 'authority' };
const CONN_TYPES = [['people','person','People'],['facts','fact','Facts'],['issues','issue','Issues'],['theories','theory','Theories'],['evidence','evidence','Evidence'],['authorities','authority','Authorities'],['tags','tag','Tags']];
const PAIRHOST = {
  'authority|evidence': ['authority','evidenceIds','evidence'],
  'authority|fact': ['authority','factIds','fact'],
  'authority|issue': ['authority','issueIds','issue'],
  'authority|person': ['authority','personIds','person'],
  'authority|tag': ['authority','tagIds','tag'],
  'authority|theory': ['authority','theoryIds','theory'],
  'evidence|issue': ['issue','evidenceIds','evidence'],
  'evidence|person': ['evidence','personIds','person'],
  'evidence|tag': ['evidence','tagIds','tag'],
  'evidence|theory': ['theory','evidenceIds','evidence'],
  'fact|issue': ['fact','issueIds','issue'],
  'fact|person': ['fact','personIds','person'],
  'fact|tag': ['fact','tagIds','tag'],
  'fact|theory': ['theory','factIds','fact'],
  'issue|person': ['issue','personIds','person'],
  'issue|tag': ['issue','tagIds','tag'],
  'issue|theory': ['theory','issueIds','issue'],
  'person|tag': ['person','tagIds','tag'],
  'person|theory': ['theory','personIds','person'],
  'tag|theory': ['theory','tagIds','tag']
};
function linkedIds(selfType, selfId, otherType) {
  if (selfType === 'fact' && otherType === 'evidence') return citesFor(selfId).map(c => c.evidenceId);
  if (selfType === 'evidence' && otherType === 'fact') return citesOf(selfId).map(c => c.factId);
  if (selfType === 'fact' && otherType === 'fact') { const f = byId(S.facts, selfId); return f && f.relatedIds ? f.relatedIds.filter(x => x !== selfId) : []; }
  const host = PAIRHOST[[selfType, otherType].sort().join('|')]; if (!host) return [];
  const [hostType, field] = host;
  if (hostType === selfType) { const rec = byId(S[STOREFOR[selfType]], selfId); return rec && rec[field] ? rec[field].slice() : []; }
  return S[STOREFOR[otherType]].filter(r => (r[field] || []).includes(selfId)).map(r => r.id);
}
async function setLink(selfType, selfId, otherType, otherId, on) {
  if ((selfType === 'fact' && otherType === 'evidence') || (selfType === 'evidence' && otherType === 'fact')) {
    const factId = selfType === 'fact' ? selfId : otherId, evId = selfType === 'evidence' ? selfId : otherId;
    const existing = S.citations.filter(c => c.factId === factId && c.evidenceId === evId);
    if (on) { if (!existing.length) { const c = { id: uid(), factId, evidenceId: evId, locType: 'note', locVal: '', snippet: '', createdAt: Date.now() }; S.citations.push(c); await Store.citations.put(c); } }
    else { for (const c of existing) await Store.citations.del(c.id); S.citations = S.citations.filter(c => !(c.factId === factId && c.evidenceId === evId)); }
    return;
  }
  if (selfType === 'fact' && otherType === 'fact') {
    const a = byId(S.facts, selfId), b = byId(S.facts, otherId); if (!a || !b || selfId === otherId) return;
    a.relatedIds = a.relatedIds || []; b.relatedIds = b.relatedIds || [];
    if (on) { if (!a.relatedIds.includes(otherId)) a.relatedIds.push(otherId); if (!b.relatedIds.includes(selfId)) b.relatedIds.push(selfId); }
    else { a.relatedIds = a.relatedIds.filter(x => x !== otherId); b.relatedIds = b.relatedIds.filter(x => x !== selfId); }
    await Store.facts.put(a); await Store.facts.put(b); return;
  }
  const host = PAIRHOST[[selfType, otherType].sort().join('|')]; if (!host) return;
  const [hostType, field] = host;
  const hostId = selfType === hostType ? selfId : otherId, valId = selfType === hostType ? otherId : selfId;
  const rec = byId(S[STOREFOR[hostType]], hostId); if (!rec) return;
  rec[field] = rec[field] || [];
  if (on) { if (!rec[field].includes(valId)) rec[field].push(valId); } else { rec[field] = rec[field].filter(x => x !== valId); }
  await Store[STOREFOR[hostType]].put(rec);
}
/* Mounts one chip connector per other-type into `container`; returns { save() }. */
function makeConnPanel(container, selfType, selfId, opts = {}) {
  const exclude = opts.exclude || [], controls = [];
  const CONN_HELP = {
    person: 'Link everyone connected here — parties, witnesses, experts, custodians. Each person then shows every fact and exhibit that touches them, so key witnesses and gaps stand out.',
    fact: 'Link the specific dated facts this relates to. Facts are the atoms of the case; connecting them builds the chain from evidence to legal elements.',
    issue: 'Link the legal elements or questions this bears on — duty, notice, causation, damages. Every element needs facts and proof behind it to win at trial.',
    theory: 'Link your theory of the case — the story that makes these facts add up to a win. Attach the proof, then watch for any theory with no evidence yet.',
    evidence: 'Link the exhibits that prove this — documents, photos, recordings, emails. An assertion with no evidence is weak; connect a source to make it stick.',
    authority: 'Link the controlling law — statutes, cases, and legal principles that govern this. Pinning facts and theories to authority is what turns a story into a legal argument.',
    tag: 'Tag for fast retrieval and triage — hot-doc, privileged, trial-exhibit, follow-up. Tags cut across everything so you can pull a set in seconds.'
  };
  CONN_TYPES.forEach(([kind, type, label]) => {
    if (type === selfType || exclude.includes(kind)) return;
    const wrap = document.createElement('div'); wrap.className = 'field full';
    wrap.innerHTML = `<label data-help="${esc(CONN_HELP[type] || '')}">${label}</label><div></div>`;
    container.appendChild(wrap);
    const init = linkedIds(selfType, selfId, type);
    const allowCreate = !(kind === 'facts' || kind === 'evidence' || kind === 'authorities');
    const chips = makeChips(wrap.querySelector('div'), kind, init, { allowCreate, placeholder: `Link ${label.toLowerCase()}…`,
      help: allowCreate ? 'Type to search; click a match to link it. To add a new one without leaving this screen, type a name and choose “Create.”' : 'Type to find and link existing items. (Create new facts, evidence, and authorities from their own screens, then link them here.)' });
    controls.push({ type, init: init.slice(), chips });
  });
  return { save: async () => {
    for (const c of controls) {
      const now = c.chips.getIds();
      for (const id of now) if (!c.init.includes(id)) await setLink(selfType, selfId, c.type, id, true);
      for (const id of c.init) if (!now.includes(id)) await setLink(selfType, selfId, c.type, id, false);
    }
  } };
}

/* ---------- Evidence kind detection + hashing ---------- */
function kindOf(name, mime) {
  const ext = (name.split('.').pop() || '').toLowerCase();
  if (/^image\//.test(mime) || /^(png|jpe?g|gif|webp|bmp|tiff?|heic)$/.test(ext)) return 'image';
  if (/^audio\//.test(mime) || /^(mp3|wav|m4a|aac|ogg|flac)$/.test(ext)) return 'audio';
  if (/^video\//.test(mime) || /^(mp4|mov|m4v|webm|avi|mkv)$/.test(ext)) return 'video';
  if (mime === 'application/pdf' || ext === 'pdf') return 'pdf';
  if (/^(eml|msg)$/.test(ext) || mime === 'message/rfc822') return 'email';
  if (/^text\//.test(mime) || /^(txt|md|csv|rtf|log|json|html?)$/.test(ext)) return 'text';
  return 'other';
}
async function sha256(blob) {
  try {
    if (!crypto.subtle || blob.size > 100 * 1024 * 1024) return null;
    const buf = await blob.arrayBuffer();
    const h = await crypto.subtle.digest('SHA-256', buf);
    return [...new Uint8Array(h)].map(b => b.toString(16).padStart(2, '0')).join('');
  } catch { return null; }
}

/* ---------- Capture parser ---------- */
function captureParse(raw) {
  let s = ' ' + raw + ' ';
  const people = [], issues = [], tags = [];
  let status = 'Supported', date = todayISO(), precision = 'exact';
  s = s.replace(/@\[([^\]]+)\]/g, (_, n) => (people.push(n), ' '));
  s = s.replace(/!\[([^\]]+)\]/g, (_, n) => (issues.push(n), ' '));
  s = s.replace(/#\[([^\]]+)\]/g, (_, n) => (tags.push(n), ' '));
  s = s.replace(/\*(supported|disputed|unverified)\b/ig, (_, w) => { status = w[0].toUpperCase() + w.slice(1).toLowerCase(); return ' '; });
  const mo = { jan:0,feb:1,mar:2,apr:3,may:4,jun:5,jul:6,aug:7,sep:8,oct:9,nov:10,dec:11 };
  let m;
  if ((m = s.match(/\b(\d{4})-(\d{2})-(\d{2})\b/))) { date = m[0]; s = s.replace(m[0], ' '); }
  else if ((m = s.match(/\b(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*\.?\s+(\d{1,2})(?:,)?\s+(\d{4})\b/i))) { date = iso(+m[3], mo[m[1].slice(0,3).toLowerCase()], +m[2]); s = s.replace(m[0], ' '); }

function expandQuery(q) {
  const ql = ' ' + q.toLowerCase().replace(/[^a-z0-9 ]+/g, ' ').replace(/\s+/g, ' ') + ' ';
  const terms = new Set(ql.trim().split(' ').filter(w => w.length > 2));
  Object.keys(CONCEPTS).forEach(k => {
    const hit = k.includes(' ') ? ql.includes(' ' + k + ' ') : terms.has(k);
    if (hit) CONCEPTS[k].forEach(x => terms.add(x.toLowerCase()));
  });
  return [...terms];
}
function relatedConcepts(q) {
  const ql = ' ' + q.toLowerCase().replace(/[^a-z0-9 ]+/g, ' ').replace(/\s+/g, ' ') + ' ';
  const toks = new Set(ql.trim().split(' ').filter(w => w.length > 2));
  const out = new Set();
  Object.keys(CONCEPTS).forEach(k => {
    const hit = k.includes(' ') ? ql.includes(' ' + k + ' ') : toks.has(k);
    if (hit) CONCEPTS[k].forEach(x => out.add(x));
  });
  return [...out].slice(0, 8);
}
function scoreAuthority(a, terms) {
  const title = (a.name || '').toLowerCase(), body = (a.body || '').toLowerCase(), ctx = (a.context || '').toLowerCase();
  const kw = ((a.keywords || []).concat(a.related || [], a.topics || [], [a.citation || ''])).join(' ').toLowerCase();
  let s = 0;
  for (const t of terms) { if (title.includes(t)) s += 6; if (kw.includes(t)) s += 4; if (ctx.includes(t)) s += 2; if (body.includes(t)) s += 1; }
  return s;
}
function searchAuthorities() {

  if (S.researchState && S.researchState !== 'all') list = list.filter(a => { const j = a.jurisdiction || 'General'; return j === S.researchState || j === 'General' || j === 'US'; });
  if (S.researchType && S.researchType !== 'all') list = list.filter(a => (a.type || 'term') === S.researchType);
  const q = (S.researchQ || '').trim();
  if (!q) return list.sort((a, b) => (a.name || '').localeCompare(b.name || ''));
  const terms = expandQuery(q);
  return list.map(a => ({ a, s: scoreAuthority(a, terms) })).filter(x => x.s > 0).sort((x, y) => y.s - x.s).map(x => x.a);
}

async function importAuthorities(file) {
  try {
    let data = JSON.parse(await cfUnprotect(await file.text()));
    if (data && !Array.isArray(data) && Array.isArray(data.authorities)) data = data.authorities;
    if (!Array.isArray(data)) throw new Error('Expected a JSON array of authorities');
    if (S.authorities.length + data.length > AUTH_CAP) {
      alert('This set has ' + data.length.toLocaleString() + ' entries, which would overload the in-app library (built for up to ' + AUTH_CAP.toLocaleString() + ').\n\nFor a full statute corpus, bundle it as the app’s database instead — it’s searched in place and stays fast. Import a smaller or filtered JSON here.');
      return;
    }
    const map = new Map(S.authorities.map(a => [a.id, a]));
    const toWrite = [];
    for (const raw of data) {
      if (!raw || !(raw.name || raw.title)) continue;
      const rec = {
        id: raw.id || uid(), type: raw.type || 'statute', jurisdiction: raw.jurisdiction || raw.state || 'US',
        name: String(raw.name || raw.title).trim(), citation: raw.citation || '', body: raw.body || raw.text || raw.summary || '',
        context: raw.context || '', related: Array.isArray(raw.related) ? raw.related : (raw.related ? String(raw.related).split(',').map(s => s.trim()) : []),
        keywords: Array.isArray(raw.keywords) ? raw.keywords : [], topics: Array.isArray(raw.topics) ? raw.topics : [],
        source: raw.source || '', url: raw.url || '', verified: !!raw.verified, createdAt: Date.now(), updatedAt: Date.now()
      };
      const ex = map.get(rec.id);
      if (ex) { Object.assign(ex, rec); toWrite.push(ex); } else { map.set(rec.id, rec); S.authorities.push(rec); toWrite.push(rec); }
    }
    if (!toWrite.length) { toast('Nothing to import'); return; }
    toast(`Importing ${toWrite.length.toLocaleString()}…`);
    const CH = 2000;
    for (let i = 0; i < toWrite.length; i += CH) await Store.authorities.bulkPut(toWrite.slice(i, i + CH));
    render(); toast(`Imported ${toWrite.length.toLocaleString()} ${toWrite.length === 1 ? 'authority' : 'authorities'}`);
  } catch (e) { alert('Import failed: ' + ((e && e.message) || e)); }
}

function buildLanes(focus) {

  const evName = id => (byId(S.evidence, id) || {}).name || '—';
  if (focus === 'fact') {
    lanes.push({ id: 'all', label: 'Chronology', type: 'fact', items: sortedFacts().filter(factMatches).map(fm), rail: [] });
  } else if (focus === 'issue') {
    S.issues.forEach(i => {
      const fs = S.facts.filter(f => f.issueIds.includes(i.id) && factMatches(f));
      const ths = S.theories.filter(t => (t.issueIds || []).includes(i.id));
      const evIds = new Set(i.evidenceIds || []); fs.forEach(f => citesFor(f.id).forEach(c => evIds.add(c.evidenceId)));
      const rail = [...ths.map(t => ({ type: 'theory', id: t.id, label: '✦ ' + t.name })), ...[...evIds].map(id => ({ type: 'evidence', id, label: '▤ ' + evName(id) }))];
      lanes.push({ id: i.id, label: i.name, type: 'issue', items: fs.map(fm), rail });
    });
  } else if (focus === 'theory') {
    S.theories.forEach(t => {
      const fs = (t.factIds || []).map(id => byId(S.facts, id)).filter(Boolean).filter(factMatches);
      const rail = [...(t.issueIds || []).map(id => ({ type: 'issue', id, label: issueName(id) })), ...(t.evidenceIds || []).map(id => ({ type: 'evidence', id, label: '▤ ' + evName(id) }))];

    });

    S.evidence.forEach(e => {
      const cites = citesOf(e.id);
      const facts = cites.map(c => byId(S.facts, c.factId)).filter(Boolean);
      const dates = facts.map(f => f.date).filter(Boolean).sort();
      const d = dates[0] || new Date(e.addedAt || Date.now()).toISOString().slice(0, 10);
      const issueIds = new Set(); facts.forEach(f => f.issueIds.forEach(x => issueIds.add(x)));
      const thIds = new Set(); facts.forEach(f => theoriesForFact(f.id).forEach(t => thIds.add(t.id)));
      const rail = [...facts.map(f => ({ type: 'fact', id: f.id, label: f.title })), ...[...issueIds].map(id => ({ type: 'issue', id, label: issueName(id) })), ...[...thIds].map(id => ({ type: 'theory', id, label: '✦ ' + theoryName(id) }))];
      lanes.push({ id: e.id, label: '▤ ' + e.name, type: 'evidence', items: [{ date: d, label: e.name, type: 'evidence', id: e.id }], rail });
    });

    S.people.forEach(p => {
      const fs = S.facts.filter(f => f.personIds.includes(p.id) && factMatches(f));

}
function renderHorizontalTimeline() {

    const rail = l.rail && l.rail.length ? `<div class="tl-railwrap" style="width:${W}px"><div class="tl-rail">${l.rail.map(rchip).join('')}</div></div>` : '';

      <div class="tl-lanebody"><div class="tl-track" style="width:${W}px;height:${trackH}px">${markers}</div>${rail}</div></div>`;
  }).join('');

    <button class="ghost sm" id="addEvBtn" data-help="Upload documents, photos, audio, video, or emails — or drag files onto the window. Everything stays on this device. Then cite each exhibit to the facts it proves.">＋ Upload</button>`;
  $('#addEvBtn').onclick = () => $('#files').click();
  headFilters('evidence');
  const q = (S.filter.q || '');
  const rows = S.evidence.filter(e => !q || (e.name + ' ' + (e.description || '')).toLowerCase().includes(q));
  if (!rows.length) { $('#view').innerHTML = `<div class="panel empty"><b>No evidence yet</b>Use ＋ Evidence (top right) or drag files anywhere onto the window.</div>`; return; }
  const sorted = rows.slice().sort((a, b) => b.addedAt - a.addedAt);
  const colls = new Map(); const singles = [];
  sorted.forEach(e => { const c = (e.collection || '').trim(); if (c) { if (!colls.has(c)) colls.set(c, []); colls.get(c).push(e); } else singles.push(e); });
  let html = '<div class="grouplist">';
  for (const [name, items] of colls) html += evCardCollection(name, items);
  for (const e of singles) html += evCardSingle(e);
  html += '</div>';
  $('#view').innerHTML = html;
  $('#view').querySelectorAll('[data-open-ev]').forEach(b => b.onclick = () => openEvidence(b.dataset.openEv));
  bindRowActions();
}

async function delTheory(id) {

  render(); toast('Theory deleted');
}

/* ---------- Connection map (dependency-free force graph) ---------- */
const mapPos = {};
function layout(nodes, edges, w, h) {
  nodes.forEach((n, i) => { if (n.x == null) { n.x = w / 2 + Math.cos(i * 1.7) * (90 + i * 4); n.y = h / 2 + Math.sin(i * 1.7) * (70 + i * 3); } n.vx = 0; n.vy = 0; });
  const idx = {}; nodes.forEach((n, i) => idx[n.id] = i);
  for (let it = 0; it < 240; it++) {
    for (let i = 0; i < nodes.length; i++) for (let j = i + 1; j < nodes.length; j++) {
      let dx = nodes[i].x - nodes[j].x, dy = nodes[i].y - nodes[j].y, d2 = dx * dx + dy * dy + 0.01, d = Math.sqrt(d2);
      let f = 2600 / d2, fx = f * dx / d, fy = f * dy / d;
      nodes[i].vx += fx; nodes[i].vy += fy; nodes[j].vx -= fx; nodes[j].vy -= fy;
    }
    edges.forEach(e => { const a = nodes[idx[e.a]], b = nodes[idx[e.b]]; if (!a || !b) return; let dx = b.x - a.x, dy = b.y - a.y, d = Math.sqrt(dx * dx + dy * dy) + 0.01, f = (d - 96) * 0.02, fx = f * dx / d, fy = f * dy / d; a.vx += fx; a.vy += fy; b.vx -= fx; b.vy -= fy; });
    nodes.forEach(n => { n.vx += (w / 2 - n.x) * 0.0022; n.vy += (h / 2 - n.y) * 0.0022; n.x += Math.max(-16, Math.min(16, n.vx)); n.y += Math.max(-16, Math.min(16, n.vy)); n.vx *= 0.86; n.vy *= 0.86; n.x = Math.max(26, Math.min(w - 26, n.x)); n.y = Math.max(26, Math.min(h - 26, n.y)); });
  }
}
function buildGraph() {
  const nodes = [], edges = [], seen = {};
  const add = (id, type, label) => { if (seen[id]) return; seen[id] = 1; nodes.push({ id, type, label }); };
  S.theories.forEach(t => {
    add(t.id, 'theory', t.name);
    (t.issueIds || []).forEach(i => { const r = byId(S.issues, i); if (r) { add(i, 'issue', r.name); edges.push({ a: t.id, b: i, kind: 'rel' }); } });
    (t.factIds || []).forEach(fi => { const f = byId(S.facts, fi); if (f) { add(fi, 'fact', f.title); edges.push({ a: t.id, b: fi, kind: 'rel' }); } });
    (t.evidenceIds || []).forEach(ei => { const e = byId(S.evidence, ei); if (e) { add(ei, 'evidence', e.name); edges.push({ a: t.id, b: ei, kind: 'rel' }); } });
  });
  S.citations.forEach(c => { const f = byId(S.facts, c.factId), e = byId(S.evidence, c.evidenceId); if (f && e) { add(c.factId, 'fact', f.title); add(c.evidenceId, 'evidence', e.name); edges.push({ a: c.factId, b: c.evidenceId, kind: 'cite' }); } });
  nodes.filter(n => n.type === 'fact').forEach(n => { const f = byId(S.facts, n.id); (f.issueIds || []).forEach(i => { if (seen[i]) edges.push({ a: n.id, b: i, kind: 'rel' }); }); (f.relatedIds || []).forEach(r => { if (seen[r]) edges.push({ a: n.id, b: r, kind: 'rel' }); }); });
  // people and their links to anything already on the graph
  S.people.forEach(p => {
    const links = [];
    S.facts.forEach(f => { if (f.personIds.includes(p.id) && seen[f.id]) links.push(f.id); });
    S.issues.forEach(i => { if ((i.personIds || []).includes(p.id) && seen[i.id]) links.push(i.id); });
    S.theories.forEach(t => { if ((t.personIds || []).includes(p.id) && seen[t.id]) links.push(t.id); });
    S.evidence.forEach(e => { if ((e.personIds || []).includes(p.id) && seen[e.id]) links.push(e.id); });
    if (links.length) { add(p.id, 'person', p.name); links.forEach(x => edges.push({ a: p.id, b: x, kind: 'rel' })); }
  });
  return { nodes, edges };
}
function viewMap() {
  $('#viewhead').innerHTML = `<div><h1>Connection map</h1><div class="sub">Drag nodes to explore how everything links. Click a node to open it.</div></div>
    <button class="ghost sm" id="relayout" data-help="Re-arrange the web. Drag any node to untangle it; click a node to open and edit it. Dense clusters show where your proof is strong; lone nodes show what still needs connecting.">↻ Re-layout</button>`;
  $('#filters').innerHTML = '';
  const { nodes, edges } = buildGraph();
  if (!nodes.length) { $('#view').innerHTML = `<div class="map-wrap"><div class="map-empty"><b>Nothing to map yet</b><br>Add a theory and connect facts/evidence, or cite evidence on a fact.</div></div>`; const rb = $('#relayout'); if (rb) rb.style.display = 'none'; return; }
  const W = Math.max(680, $('#view').clientWidth || 900), H = Math.round(window.innerHeight * 0.62);
  nodes.forEach(n => { if (mapPos[n.id]) { n.x = mapPos[n.id].x; n.y = mapPos[n.id].y; } });
  layout(nodes, edges, W, H);
  nodes.forEach(n => mapPos[n.id] = { x: n.x, y: n.y });
  const R = { theory: 16, fact: 10, evidence: 10, issue: 9, person: 9 };
  const edgeSvg = edges.map(e => { const a = nodes.find(n => n.id === e.a), b = nodes.find(n => n.id === e.b); if (!a || !b) return ''; return `<line class="edge ${e.kind === 'cite' ? 'cite' : ''}" data-a="${esc(e.a)}" data-b="${esc(e.b)}" x1="${a.x.toFixed(1)}" y1="${a.y.toFixed(1)}" x2="${b.x.toFixed(1)}" y2="${b.y.toFixed(1)}"/>`; }).join('');
  const nodeSvg = nodes.map(n => `<g class="node n-${n.type}" data-id="${esc(n.id)}" data-type="${n.type}" transform="translate(${n.x.toFixed(1)},${n.y.toFixed(1)})"><circle r="${R[n.type] || 9}"></circle><text x="${(R[n.type] || 9) + 5}" y="4">${esc(short(n.label, 22))}</text></g>`).join('');
  $('#view').innerHTML = `<div class="map-wrap"><div class="map-toolbar"><span>${nodes.length} nodes · ${edges.length} links</span>
    <div class="map-legend"><span><i style="background:#caa23f"></i>Theory</span><span><i style="background:#7b2d3a"></i>Fact</span><span><i style="background:#1f6b5b"></i>Evidence</span><span><i style="background:#3f5578"></i>Issue</span><span><i style="background:#6b5f49"></i>Person</span></div></div>
    <svg class="map-svg" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet"><g>${edgeSvg}</g><g>${nodeSvg}</g></svg></div>`;
  const rb = $('#relayout'); if (rb) rb.onclick = () => { nodes.forEach(n => delete mapPos[n.id]); render(); };
  bindMap(nodes);
}
function bindMap(nodes) {
  const svg = $('#view').querySelector('.map-svg'); if (!svg) return;
  let drag = null, moved = false;
  const pt = evt => { const r = svg.getBoundingClientRect(), vb = svg.viewBox.baseVal; return { x: (evt.clientX - r.left) / r.width * vb.width, y: (evt.clientY - r.top) / r.height * vb.height }; };
  svg.querySelectorAll('.node').forEach(g => g.addEventListener('pointerdown', e => { e.preventDefault(); drag = { g, id: g.dataset.id, type: g.dataset.type }; moved = false; try { g.setPointerCapture(e.pointerId); } catch (_) {} }));
  svg.addEventListener('pointermove', e => {
    if (!drag) return; moved = true; const p = pt(e), n = nodes.find(x => x.id === drag.id); if (!n) return;
    n.x = p.x; n.y = p.y; mapPos[n.id] = { x: p.x, y: p.y };
    drag.g.setAttribute('transform', `translate(${p.x.toFixed(1)},${p.y.toFixed(1)})`);
    svg.querySelectorAll('line').forEach(l => { if (l.dataset.a === n.id) { l.setAttribute('x1', p.x.toFixed(1)); l.setAttribute('y1', p.y.toFixed(1)); } if (l.dataset.b === n.id) { l.setAttribute('x2', p.x.toFixed(1)); l.setAttribute('y2', p.y.toFixed(1)); } });
  });
  const end = () => { if (drag && !moved) openNode(drag.type, drag.id); drag = null; };
  svg.addEventListener('pointerup', end);
  svg.addEventListener('pointercancel', () => { drag = null; });
}
function openNode(type, id) {
  if (type === 'theory') openTheoryModal(id);
  else if (type === 'fact') openFactModal(id);
  else if (type === 'evidence') openEvidence(id);
  else if (type === 'issue') { S.filter = { issueId: id }; S.view = 'timeline'; render(); }
}

function rowFact(f, cite) {
  const q = cite && cite.snippet ? `<span class="q"> — “${esc(cite.snippet)}”</span>` : '';
  const loc = cite && cite.locVal ? ` <span class="chip ev mini" data-open-cite="${cite.id}">${esc(cite.locVal)}</span>` : '';
  const tu = factThumb(f); const thumb = tu ? `<span class="rf-thumb"><img src="${tu}" alt=""></span>` : '';
  return `<div class="rowfact" data-edit-row="${f.id}"><div class="rf-date">${esc(fmtDate(f.date, f.precision))}</div>
    <div class="rf-title">${thumb}${esc(f.title)}${q} <span class="status ${f.status}" style="vertical-align:middle">${f.status}</span>${loc}</div></div>`;
}
function bindFactActions() {
  $('#view').querySelectorAll('[data-edit]').forEach(b => b.onclick = () => openFactModal(b.dataset.edit));
  $('#view').querySelectorAll('[data-del]').forEach(b => b.onclick = () => delFact(b.dataset.del));
  $('#view').querySelectorAll('[data-open-cite]').forEach(b => b.onclick = () => { const c = byId(S.citations, b.dataset.openCite); if (c) openEvidence(c.evidenceId, c); });
  $('#view').querySelectorAll('[data-open-theory]').forEach(b => b.onclick = () => openTheoryModal(b.dataset.openTheory));
  $('#view').querySelectorAll('[data-open-issue]').forEach(b => b.onclick = () => openIssueModal(b.dataset.openIssue));
}
function bindRowActions() {
  $('#view').querySelectorAll('[data-edit-row]').forEach(b => b.onclick = e => { if (e.target.closest('[data-open-cite]') || e.target.closest('[data-open-theory]') || e.target.closest('[data-open-issue]')) return; openFactModal(b.dataset.editRow); });
  $('#view').querySelectorAll('[data-open-cite]').forEach(b => b.onclick = e => { e.stopPropagation(); const c = byId(S.citations, b.dataset.openCite); if (c) openEvidence(c.evidenceId, c); });
  $('#view').querySelectorAll('[data-open-theory]').forEach(b => b.onclick = e => { e.stopPropagation(); openTheoryModal(b.dataset.openTheory); });
  $('#view').querySelectorAll('[data-open-issue]').forEach(b => b.onclick = e => { e.stopPropagation(); openIssueModal(b.dataset.openIssue); });
}
async function delFact(id) {
  if (!confirm('Delete this fact? Its evidence citations will also be removed.')) return;
  S.facts = S.facts.filter(f => f.id !== id); await Store.facts.del(id);
  for (const c of citesFor(id)) { await Store.citations.del(c.id); }
  S.citations = S.citations.filter(c => c.factId !== id);
  render(); toast('Fact deleted');
}

function annotateHelp(root) {

function modal(html, opts = {}) {

function closeModal() { $('#modalRoot').classList.remove('show'); $('#modalRoot').innerHTML = ''; }

/* ---------- Fact editor ---------- */

      <div class="field"><label>Assessment</label><select id="e-status">${['Supported','Disputed','Unverified'].map(v => opt(v, f.status)).join('')}</select></div>
      <div class="connpanel" id="e-conn"></div>

    </div>
    <div class="modalfoot"><button class="ghost" data-close>Cancel</button><button class="primary" id="e-save">Save fact</button></div>`, { wide: true });

}
function renderFactCites(f) {
  const box = $('#e-cites'); const cites = citesFor(f.id);
  box.innerHTML = cites.length ? cites.map(c => { const e = byId(S.evidence, c.evidenceId);
    return `<div class="manage-row"><span class="chip ev" data-open-cite="${c.id}">▤ ${esc(e ? e.name : '—')}${c.locVal ? ' · ' + esc(c.locVal) : ''}</span>

  box.querySelectorAll('[data-open-cite]').forEach(b => b.onclick = () => { const c = byId(S.citations, b.dataset.openCite); if (c) openEvidence(c.evidenceId, c); });

async function addReference(name) {
  const rec = { id: uid(), name, kind: kindOf(name, ''), mime: '', size: 0, hash: null, addedAt: Date.now(), description: '', hasFile: false };
  S.evidence.push(rec); await Store.evidence.put(rec); return rec.id;
}

/* ---------- Evidence upload + viewer ---------- */
async function handleFiles(fileList) {
  const files = [...fileList]; if (!files.length) return;
  let collection = '';
  if (files.length > 1) {
    const name = await cfAskText({ title: `Add ${files.length} files`, ok: 'Add',
      msg: 'Name a collection to keep these together (e.g. “Scene photos”), or leave blank to add them as separate items.', placeholder: 'Collection name (optional)' });
    if (name === null) return; // cancelled — don't add anything
    collection = name.trim();
  }
  for (const file of files) {
    const rec = { id: uid(), name: file.name, kind: kindOf(file.name, file.type), mime: file.type || 'application/octet-stream',
      size: file.size, hash: await sha256(file), addedAt: Date.now(), description: '', collection, memberId: S._activeMember || '', hasFile: true, blob: file };
    S.evidence.push(rec); await Store.evidence.put(rec);
  }
  render(); toast(collection ? `${files.length} file(s) added to “${collection}”` : `${files.length} file(s) saved on this device`);
}
let viewerURL = null;

  const e = byId(S.evidence, id); if (!e) return;

  let preview = '';
  if (!e.hasFile) {
    preview = `<div class="ev-noview">Reference only — no file attached.<br><button class="ghost sm" id="attachBtn" style="margin-top:10px">Attach a file to this reference</button></div>`;
  } else {
    viewerURL = URL.createObjectURL(e.blob);

    if (e.kind === 'image' && isHeic(e) && !window.__CF_NATIVE_HEIC__) preview = `<div class="ev-noview">HEIC images can't be shown inline by a browser.<br><a class="linkbtn" href="${viewerURL}" download="${esc(e.name)}">Download ${esc(e.name)}</a><br><span style="font-size:12px;color:var(--faint)">The desktop app will display HEIC directly.</span></div>`;

    else if (e.kind === 'audio') preview = `<audio controls src="${viewerURL}" id="ev-media"></audio>`;
    else if (e.kind === 'video') preview = `<video controls src="${viewerURL}" id="ev-media"></video>`;
    else if (e.kind === 'pdf') preview = `<iframe src="${viewerURL}"></iframe>`;
    else if (e.kind === 'text' || e.kind === 'email') preview = `<pre id="ev-text">Loading…</pre>`;
    else preview = `<div class="ev-noview">No inline preview for this type.<br><a class="linkbtn" href="${viewerURL}" download="${esc(e.name)}">Download ${esc(e.name)}</a></div>`;
  }
  const cites = citesOf(e.id);
  modal(`<div class="modalhd"><div><h2>${esc(e.name)}</h2><p>${esc(e.kind)}${e.hasFile ? ' · ' + (e.size / 1048576).toFixed(2) + ' MB' : ' · reference'}${e.hash ? ' · ' + e.hash.slice(0, 12) + '…' : ''}</p></div><button class="x">✕</button></div>
    <div class="mbody"><div class="ev-view">${preview}</div>
      ${cite ? `<div class="ev-meta"><span class="chip date">${esc(cite.locType)}: ${esc(cite.locVal || '—')}</span>${cite.snippet ? `<span class="chip">“${esc(cite.snippet)}”</span>` : ''}</div>` : ''}
      <div class="cited-list"><label class="field" style="font-size:11px;font-weight:700;color:var(--ink-soft);text-transform:uppercase">Cited by ${cites.length} fact(s)</label>
        ${cites.map(c => { const f = byId(S.facts, c.factId); return f ? `<div class="rowfact"><div class="rf-date">${esc(fmtDate(f.date, f.precision))}</div><div class="rf-title">${esc(f.title)}</div></div>` : ''; }).join('') || '<div class="ministat">Not cited yet.</div>'}
      </div></div>
    <div class="modalfoot">${e.hasFile ? `<a class="ghost" href="${viewerURL}" download="${esc(e.name)}">Download</a>` : ''}<button class="ghost" id="ev-edit">Edit &amp; connect</button><button class="ghost danger" id="ev-del">Delete</button><button class="primary" data-close>Done</button></div>`, { wide: true });

  $('#ev-edit').onclick = () => openEvidenceEditor(e.id);

  const media = $('#ev-media'); if (media && cite && cite.locType === 'time') media.addEventListener('loadedmetadata', () => { try { media.currentTime = hmsToSec(cite.locVal); } catch {} });
  $('#ev-del').onclick = async () => { if (confirm('Delete this evidence and its citations?')) { await Store.evidence.del(e.id); S.evidence = S.evidence.filter(x => x.id !== e.id); for (const c of citesOf(e.id)) await Store.citations.del(c.id); S.citations = S.citations.filter(c => c.evidenceId !== e.id); closeModal(); render(); toast('Evidence deleted'); } };
  const ab = $('#attachBtn'); if (ab) ab.onclick = () => { const inp = document.createElement('input'); inp.type = 'file'; inp.onchange = async () => { const file = inp.files[0]; if (!file) return; Object.assign(e, { name: e.name, kind: kindOf(file.name, file.type), mime: file.type, size: file.size, hash: await sha256(file), hasFile: true, blob: file }); await Store.evidence.put(e); openEvidence(e.id); render(); toast('File attached'); }; inp.click(); };
}
const hmsToSec = v => { if (!v) return 0; const p = String(v).replace(/[^\d:]/g, '').split(':').map(Number); return p.length === 3 ? p[0] * 3600 + p[1] * 60 + p[2] : p.length === 2 ? p[0] * 60 + p[1] : p[0] || 0; };
const isHeic = e => /\.(heic|heif)$/i.test(e.name || '') || /image\/hei[cf]/i.test(e.mime || '');
function formatEmail(t) { const head = t.slice(0, 4000); const g = re => (head.match(re) || [, ''])[1].trim(); return `From:    ${g(/^From:\s*(.+)$/im)}\nTo:      ${g(/^To:\s*(.+)$/im)}\nDate:    ${g(/^Date:\s*(.+)$/im)}\nSubject: ${g(/^Subject:\s*(.+)$/im)}\n\n${t.replace(/^[\s\S]*?\r?\n\r?\n/, '').slice(0, 16000)}`; }

/* ---------- Backup / restore ---------- */
const blobToDataURL = b => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = () => rej(r.error); r.readAsDataURL(b); });
function dataURLtoBlob(d) { const [h, b] = d.split(','); const mime = (h.match(/:(.*?);/) || [, ''])[1]; const bin = atob(b); const arr = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i); return new Blob([arr], { type: mime }); }
/* ---------- Encryption (passphrase · AES-GCM-256 · built-in Web Crypto, no libraries) ----------
   Backups are encrypted on this device before they ever leave it. Whoever restores or
   merges the file must enter the same passphrase. Old unencrypted backups still restore. */
const ENC_FMT = 'caseframe-enc-v1', ENC_ITER = 210000;
function _b64(buf) { const b = new Uint8Array(buf); let s = '', CH = 0x8000; for (let i = 0; i < b.length; i += CH) s += String.fromCharCode.apply(null, b.subarray(i, i + CH)); return btoa(s); }
function _unb64(s) { const bin = atob(s), a = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i); return a; }
async function _deriveKey(pass, salt) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name: 'PBKDF2', salt, iterations: ENC_ITER, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
}
async function cfEncrypt(plaintext, pass) {
  const salt = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12));
  const key = await _deriveKey(pass, salt);
  const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, new TextEncoder().encode(plaintext));
  return JSON.stringify({ format: ENC_FMT, kdf: 'PBKDF2', hash: 'SHA-256', iter: ENC_ITER, salt: _b64(salt), iv: _b64(iv), cipher: _b64(ct) });
}
async function cfDecrypt(env, pass) {
  const key = await _deriveKey(pass, _unb64(env.salt));
  let pt; try { pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: _unb64(env.iv) }, key, _unb64(env.cipher)); }
  catch (_) { throw new Error('Wrong passphrase or the file is damaged'); }
  return new TextDecoder().decode(pt);
}
// Small promise-based passphrase dialog — works in the browser PWA and in the Tauri WebView
// (we avoid window.prompt because WebView does not reliably support it).
function cfAskPass(o) {
  return new Promise(resolve => {
    const ov = document.createElement('div');
    ov.style.cssText = 'position:fixed;inset:0;z-index:99999;background:rgba(20,16,12,.55);display:flex;align-items:center;justify-content:center;padding:20px';
    ov.innerHTML = '<div style="background:#fffdf8;color:#211f1b;border:1px solid #e6ddcf;border-radius:14px;max-width:430px;width:100%;padding:22px;box-shadow:0 24px 70px rgba(40,32,20,.35);font:15px/1.5 system-ui,-apple-system,sans-serif">'
      + '<div style="font:600 18px/1.2 ui-serif,Georgia,serif;margin-bottom:8px">' + o.title + '</div>'
      + '<div style="color:#7c746a;font-size:13px;margin-bottom:14px;white-space:pre-line">' + o.msg + '</div>'

// Encrypt a backup string before writing. Returns ciphertext, or null if the user cancels.
async function cfProtect(jsonStr) {
  const pass = await cfAskPass({ title: 'Encrypt this backup', confirm: true,
    msg: 'Set a passphrase. Anyone who restores or merges this file must use the same passphrase.\n\n⚠ If the passphrase is lost, the data cannot be recovered.' });
  if (pass === null) return null;
  return await cfEncrypt(jsonStr, pass);
}
// Decrypt a loaded file if it is encrypted; pass plaintext (old backups) straight through.
async function cfUnprotect(raw) {
  let obj; try { obj = JSON.parse(raw); } catch (_) { throw new Error('Not a valid Caseframe file'); }
  if (obj && obj.format === ENC_FMT) {
    const pass = await cfAskPass({ title: 'Encrypted backup', confirm: false, msg: 'Enter the passphrase for this file.' });
    if (pass === null) throw new Error('Cancelled');
    return await cfDecrypt(obj, pass);
  }
  return raw;
}

async function doBackup() {
  const CAP = 25 * 1024 * 1024; let skipped = 0;
  const ev = []; for (const e of S.evidence) { const o = { ...e }; delete o.blob; if (e.hasFile && e.blob) { if (e.size <= CAP) o.data = await blobToDataURL(e.blob); else { o.data = null; o.skipped = true; skipped++; } } ev.push(o); }
  const payload = { format: 'caseframe-local-v2', exportedAt: new Date().toISOString(), matter: S.matter, people: S.people, issues: S.issues, tags: S.tags, theories: S.theories, authorities: S.authorities, facts: S.facts, citations: S.citations, evidence: ev };
  const enc = await cfProtect(JSON.stringify(payload));
  if (enc === null) { toast('Backup cancelled'); return; }
  const url = URL.createObjectURL(new Blob([enc], { type: 'application/json' }));
  const a = document.createElement('a'); a.href = url; a.download = 'caseframe-backup-' + todayISO() + '.cfenc.json'; a.click(); setTimeout(() => URL.revokeObjectURL(url), 2000);
  toast(skipped ? `Encrypted backup saved — ${skipped} large file(s) exported as reference only` : 'Encrypted backup downloaded');
}
async function doRestore(file) {
  try {
    const p = JSON.parse(await cfUnprotect(await file.text()));
    if (p.format !== 'caseframe-local-v2') throw new Error('Not a Caseframe v2 backup');
    if (!confirm('Replace everything in this browser with the backup contents?')) return;
    for (const s of ['facts','evidence','people','issues','tags','citations','theories','authorities','meta']) await Store[s].clear();
    S.matter = p.matter || null; if (S.matter) await Store.meta.put(S.matter);
    S.people = p.people || []; S.issues = p.issues || []; S.tags = p.tags || []; S.theories = p.theories || []; S.authorities = p.authorities || []; S.facts = p.facts || []; S.citations = p.citations || [];
    S.evidence = [];
    for (const e of (p.evidence || [])) { const rec = { ...e }; delete rec.data; if (e.data) { rec.blob = dataURLtoBlob(e.data); rec.hasFile = true; } S.evidence.push(rec); }
    for (const a of S.people) await Store.people.put(a);
    for (const a of S.issues) await Store.issues.put(a);
    for (const a of S.tags) await Store.tags.put(a);
    for (const a of S.theories) await Store.theories.put(a);
    for (const a of S.authorities) await Store.authorities.put(a);
    for (const a of S.facts) await Store.facts.put(a);
    for (const a of S.citations) await Store.citations.put(a);
    for (const a of S.evidence) await Store.evidence.put(a);

  } catch (e) { alert('Could not restore: ' + e.message); }
}

/* ---------- Merge (combine two devices without losing anything) ----------
   Adds records the other side created, unions every connection array, and for a
   record edited on both sides keeps the most recently updated version's scalar
   fields. Nothing is deleted. Works cleanly when both devices started from the
   same backup (shared ids). */
function mergeRecord(local, incoming) {
  const lU = local.updatedAt || local.createdAt || 0, iU = incoming.updatedAt || incoming.createdAt || 0;
  const base = iU >= lU ? Object.assign({}, incoming) : Object.assign({}, local);
  const keys = new Set([...Object.keys(local), ...Object.keys(incoming)]);
  for (const k of keys) {
    if (Array.isArray(local[k]) || Array.isArray(incoming[k])) {
      const a = Array.isArray(local[k]) ? local[k] : [], b = Array.isArray(incoming[k]) ? incoming[k] : [];
      base[k] = [...new Set([...a, ...b])];
    }
  }
  return base;
}
async function doMerge(file) {
  try {
    const p = JSON.parse(await cfUnprotect(await file.text()));
    if (p.format !== 'caseframe-local-v2') throw new Error('Not a Caseframe v2 backup');
    if (!confirm('Merge this file into the current case?\n\nNew items and links are ADDED, and anything edited on both sides keeps the most recent version. Nothing is deleted.')) return;
    for (const store of ['people','issues','tags','theories','authorities','facts']) {
      for (const inc of (p[store] || [])) {
        const loc = byId(S[store], inc.id);
        if (!loc) { S[store].push(inc); await Store[store].put(inc); }
        else { Object.assign(loc, mergeRecord(loc, inc)); await Store[store].put(loc); }
      }
    }
    for (const inc of (p.evidence || [])) {
      const incCopy = Object.assign({}, inc); const incData = incCopy.data; delete incCopy.data;
      const loc = byId(S.evidence, inc.id);
      if (!loc) {
        const rec = incCopy;
        if (incData) { rec.blob = dataURLtoBlob(incData); rec.hasFile = true; }
        S.evidence.push(rec); await Store.evidence.put(rec);
      } else {
        const m = mergeRecord(Object.assign({}, loc, { data: undefined }), incCopy);
        if (loc.blob) { m.blob = loc.blob; m.hasFile = true; }
        else if (incData) { m.blob = dataURLtoBlob(incData); m.hasFile = true; }
        delete m.data;
        Object.assign(loc, m); await Store.evidence.put(loc);
      }
    }
    for (const inc of (p.citations || [])) {
      if (byId(S.citations, inc.id)) continue;
      const dup = S.citations.find(c => c.factId === inc.factId && c.evidenceId === inc.evidenceId && (c.locVal || '') === (inc.locVal || '') && (c.snippet || '') === (inc.snippet || ''));
      if (!dup) { S.citations.push(inc); await Store.citations.put(inc); }
    }
    if (!S.matter && p.matter) { S.matter = p.matter; await Store.meta.put(S.matter); }
    render(); toast('Merged — nothing was deleted');
  } catch (e) { alert('Could not merge: ' + e.message); }
}

/* ---------- Init ---------- */
async function loadAll() {
  [S.facts, S.evidence, S.people, S.issues, S.tags, S.citations, S.theories, S.members, S.groups] = await Promise.all(
    ['facts','evidence','people','issues','tags','citations','theories','members','groups'].map(s => Store[s].all()));
  // Authorities can be huge if a big corpus was imported into app storage. Loading all of
  // that into memory on every launch makes the whole app sluggish — so if the store is
  // oversized, skip it and flag for a one-click cleanup instead.
  let authCount = 0; try { authCount = await Store.authorities.count(); } catch (_) {}
  if (authCount > AUTH_CAP) { S.authorities = []; S._authOversized = authCount; }
  else { S.authorities = await Store.authorities.all(); S._authOversized = 0; }
  // One-time fix: earlier builds seeded every Wex glossary term with the generic
  // landing URL. Deep-link each to its specific term page so "Open source" works.
  try {
    const wf = await Store.meta.get('wex-linked');
    if (!(wf && wf.v) && !S._authOversized) {
      const fixes = S.authorities.filter(a => a.url === 'https://www.law.cornell.edu/wex' && a.name);
      for (const a of fixes) { a.url = wexURL(a.name); await Store.authorities.put(a); }
      await Store.meta.put({ id: 'wex-linked', v: true });
    }
  } catch (_) {}
  S.matter = await Store.meta.get('matter');
  const ls = await Store.meta.get('lens'); if (ls && ls.v) S.lens = ls.v;
  const us = await Store.meta.get('userSources'); S._userSources = (us && us.v) || [];
  const srv = await Store.meta.get('clToken'); S._clToken = (srv && srv.v) || '';
  // Optional editable legal primer bundled with the Mac app (resources/legal_primer.md).
  if (typeof window.__CF_PRIMER === 'function') { try { const p = await window.__CF_PRIMER(); if (p && p.trim()) S._primer = p; } catch (_) {} }
  // Class-action build detection: the "Class Action Builder" variant turns on member/group features.
  try {
    let name = '';
    if (typeof window.__CF_NAME === 'function') name = (await window.__CF_NAME()) || '';
    S._classMode = /class action/i.test(name) || /class action/i.test(document.title || '');
    // In the Class Action Builder, member management is the whole point — land there.
    if (S._classMode && (!S.view || S.view === 'timeline')) S.view = 'members';
  } catch (_) {}
}

const escML = s => esc(s).replace(/\n/g, '<br>');
const EXP_NOTE = t => '<p class="muted-note">' + esc(t) + '</p>';
const EXPORT_PERSPECTIVES = [
  ['chronological', 'Chronological narrative', 'The case told as a timeline of events.'],
  ['claim', 'By claim & element', 'Grouped by legal element, with proof under each.'],
  ['party', 'By party', 'What each person did and is connected to.'],
  ['evidence', 'By evidence', 'Exhibit-driven — what each piece proves.']
];
const EXPORT_DEPTHS = [
  ['brief', 'Brief', 'A one- to two-page snapshot — essentials only.'],
  ['extended', 'Extended', 'Adds supporting facts, evidence, and authorities.'],
  ['comprehensive', 'Comprehensive', 'Element-by-element proof, full chronology, thumbnails.'],
